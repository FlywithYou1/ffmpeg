name: FFmpeg 多厂商构建

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 22:00 = UTC 14:00 — 仅更新 vcpkg baseline（比编译提前 2 小时）
    - cron: '0 14 * * *'
    # 北京时间每天 0:00 = UTC 16:00 — 完整构建 / nightly Release
    - cron: '0 16 * * *'
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '.github/workflows/build-ffmpeg.yml'
      - 'scripts/**'
      - 'vcpkg.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 每日 22:00（北京）— 仅回写 vcpkg baseline（Dependabot 已移除）
  # github.event.schedule 区分两个 cron
  # ============================================================
  vcpkg-update:
    name: 更新 vcpkg baseline
    if: github.event_name == 'schedule' && github.event.schedule == '0 14 * * *'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 检查并回写 builtin-baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CURRENT=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          LATEST=$(git ls-remote https://github.com/microsoft/vcpkg.git HEAD | cut -f1)
          echo "current=$CURRENT"
          echo "latest=$LATEST"

          if [ -z "$LATEST" ]; then
            echo "::error::failed to resolve microsoft/vcpkg HEAD"
            exit 1
          fi

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "vcpkg baseline already latest: $CURRENT"
            exit 0
          fi

          python3 -c "
          import re, pathlib
          p = pathlib.Path('vcpkg.json')
          text = p.read_text(encoding='utf-8')
          text2, n = re.subn(
              r'(\"builtin-baseline\"\\s*:\\s*\")[^\"]*(\")',
              r'\\g<1>${LATEST}\\g<2>',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('builtin-baseline replace failed')
          p.write_text(text2, encoding='utf-8')
          "
          git add vcpkg.json
          git commit -m "chore(vcpkg): bump baseline to $LATEST"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Pushed vcpkg baseline: $CURRENT -> $LATEST"

  quality-check:
    name: CI helper tests and syntax
    if: github.event.schedule != '0 14 * * *'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Python regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Script and workflow syntax
        run: |
          command -v bash
          command -v pwsh
          python3 scripts/ci/check-syntax.py

  # ============================================================
  # 构建元数据（决定 Release 标签与类型）
  # ============================================================
  metadata:
    name: 构建元数据
    if: github.event.schedule != '0 14 * * *'
    runs-on: ubuntu-26.04
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      should_release: ${{ steps.vars.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7

      - name: 确定 Release 参数
        id: vars
        run: |
          EVENT_NAME="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$EVENT_NAME" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "0 16 * * *" ]; then
            TAG="nightly-$(date -u +%Y-%m-%d-%H%M%S)"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="prerelease-$(date -u +%Y-%m-%d-%H%M%S)"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # LINUX — Matrix（NVIDIA / Intel QSV / AMD VAAPI / x86 整合 / ARM64）
  # ============================================================
  linux:
    name: ${{ matrix.name }}
    needs: quality-check
    if: github.event.schedule != '0 14 * * *'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: nvidia
            name: Linux（NVIDIA NVENC/CUDA）
            runner: ubuntu-26.04
            extra_packages: libva-dev libvpl-dev libdrm-dev
            cuda: true
            vmaf_cuda: true
            configure_extra: --enable-libvmaf --enable-ffnvcodec --disable-cuda-nvcc --enable-cuda-llvm --enable-cuvid --enable-nvenc
            verify_args: --require-encoder h264_nvenc --require-encoder hevc_nvenc --require-encoder av1_nvenc
            artifact: ffmpeg-linux-nvidia.tar.xz
          - id: intel-qsv
            name: Linux（Intel QSV）
            runner: ubuntu-26.04
            extra_packages: libva-dev libvpl-dev libdrm-dev
            cuda: false
            vmaf_cuda: false
            configure_extra: --enable-libvmaf --enable-libvpl --enable-vaapi --disable-ffnvcodec --disable-cuda-nvcc --disable-cuda-llvm --disable-cuvid --disable-nvenc
            verify_args: --require-encoder h264_qsv --require-encoder hevc_qsv --require-encoder h264_vaapi
            artifact: ffmpeg-linux-intel-qsv.tar.xz
          - id: amd
            name: Linux（AMD VAAPI）
            runner: ubuntu-26.04
            extra_packages: libva-dev libdrm-dev
            cuda: false
            vmaf_cuda: false
            configure_extra: --enable-libvmaf --enable-vaapi --disable-ffnvcodec --disable-cuda-nvcc --disable-cuda-llvm --disable-cuvid --disable-nvenc
            verify_args: --require-encoder h264_vaapi --require-encoder hevc_vaapi
            artifact: ffmpeg-linux-amd.tar.xz
          - id: x86-all
            name: "Linux x86 整合版（NVIDIA + Intel QSV + AMD VAAPI）"
            runner: ubuntu-26.04
            extra_packages: libva-dev libvpl-dev libdrm-dev
            cuda: true
            vmaf_cuda: true
            configure_extra: --enable-libvmaf --enable-ffnvcodec --disable-cuda-nvcc --enable-cuda-llvm --enable-cuvid --enable-nvenc --enable-vaapi --enable-libvpl
            verify_args: --require-encoder h264_nvenc --require-encoder hevc_nvenc --require-encoder av1_nvenc --require-encoder h264_qsv --require-encoder hevc_qsv --require-encoder h264_vaapi
            artifact: ffmpeg-linux-x86-all.tar.xz
            av2: true
            av2_artifact: ffmpeg-linux-x86-all-av2.tar.xz
          - id: arm
            name: Linux（ARM64 VAAPI）
            runner: ubuntu-26.04-arm
            extra_packages: libva-dev libdrm-dev
            cuda: false
            vmaf_cuda: false
            configure_extra: --enable-libvmaf --enable-vaapi --disable-ffnvcodec --disable-cuda-nvcc --disable-cuda-llvm --disable-cuvid --disable-nvenc
            verify_args: --require-encoder h264_vaapi --require-encoder hevc_vaapi
            artifact: ffmpeg-linux-arm.tar.xz
    steps:
      - uses: actions/checkout@v7
      - name: 准备构建目录
        run: |
          BUILD_ROOT="${RUNNER_TEMP}/ffmpeg-build"
          mkdir -p "$BUILD_ROOT"
          echo "CI_BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential yasm nasm pkg-config meson ninja-build \
            cmake git wget curl ca-certificates gnupg python3 xxd clang llvm patchelf \
            libsdl2-dev \
            ${{ matrix.extra_packages }} \
            libx264-dev libx265-dev libvpx-dev libopus-dev libvorbis-dev \
            libtheora-dev libaom-dev libwebp-dev libass-dev libfreetype6-dev \
            libfontconfig1-dev libzimg-dev libsoxr-dev libopenjp2-7-dev \
            libsnappy-dev libvulkan-dev opencl-headers ocl-icd-opencl-dev glslc \
            libsvtav1enc-dev libdav1d-dev libkvazaar-dev libcrypto++-dev libopenh264-dev libxvidcore-dev \
            libtwolame-dev libspeex-dev libcodec2-dev libjxl-dev libopenmpt-dev libnuma-dev \
            liblcms2-dev libxxhash-dev libbs2b-dev libaribb24-dev libplacebo-dev glslang-dev spirv-tools librubberband-dev libvidstab-dev

      - name: 安装最新 CUDA 工具包
        id: cuda
        if: matrix.cuda
        uses: mjun0812/setup-cuda@v1
        with:
          version: 'latest'
          method: 'auto'

      - name: 检测 CUDA
        if: matrix.cuda
        run: |
          CUDA_BASE="${CUDA_HOME:-${CUDA_PATH:-}}"
          [ -x "${CUDA_BASE}/bin/nvcc" ] || { echo "::error::Action 未提供有效 CUDA 路径"; exit 1; }
          [ -z "${CUDA_BASE}" ] && { echo "::error::未找到 CUDA"; exit 1; }
          echo "CUDA_HOME=${CUDA_BASE}" >> "${GITHUB_ENV}"
          "${CUDA_BASE}/bin/nvcc" --version
          CUDA_CLANG="$(command -v clang)"
          "$CUDA_CLANG" --print-targets | grep -q nvptx || { echo "::error::Clang lacks the NVPTX backend"; exit 1; }
          printf '%s\n' '__attribute__((global)) void ffmpeg_cuda_probe(void) {}' > "${RUNNER_TEMP}/ffmpeg-cuda-probe.cu"
          "$CUDA_CLANG" -S -x cuda --cuda-device-only -nocudainc -nocudalib --cuda-gpu-arch=sm_75 \
            "${RUNNER_TEMP}/ffmpeg-cuda-probe.cu" -o "${RUNNER_TEMP}/ffmpeg-cuda-probe.ptx"
          grep -q '\.entry' "${RUNNER_TEMP}/ffmpeg-cuda-probe.ptx"
          echo "FFMPEG_CUDA_CLANG=$CUDA_CLANG" >> "${GITHUB_ENV}"

      - name: 编译 nv-codec-headers
        if: matrix.cuda
        run: |
          P="${HOME}/ffmpeg-install"
          cd "$CI_BUILD_ROOT" && git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers
          cd nv-codec-headers
          make -j"$(nproc)" PREFIX="$P" && make PREFIX="$P" install
          mkdir -p "$P/share/nv-codec-headers"
          cp include/ffnvcodec/nvEncodeAPI.h "$P/share/nv-codec-headers/copyright"
          # VMAF 的 nvcc fatbin 目标写死了 -I，只认 nvcc 默认搜索路径，
          # 因此同时装到 /usr/local 供 CUDA 编解码头文件被找到。
          sudo make PREFIX=/usr/local install

      - name: 编译 VMAF
        run: |
          P="${HOME}/ffmpeg-install"
          cd "$CI_BUILD_ROOT" && git clone --depth 1 https://github.com/Netflix/vmaf.git
          cd vmaf/libvmaf && rm -rf build
          export PKG_CONFIG_PATH="$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          if [ "${{ matrix.vmaf_cuda }}" = "true" ]; then
            export CUDA_PATH="${CUDA_HOME}" CUDACXX="${CUDA_HOME}/bin/nvcc"
            export PATH="${CUDA_HOME}/bin:${PATH}"
            export C_INCLUDE_PATH="$P/include:${CUDA_HOME}/include:${C_INCLUDE_PATH:-}"
            meson setup build --buildtype release --prefix="$P" --libdir=lib \
              -Ddefault_library=static -Denable_tools=false -Denable_docs=false -Denable_tests=false \
              -Denable_cuda=true -Dc_link_args="-lstdc++" -Dcpp_link_args="-lstdc++"
          else
            meson setup build --buildtype release --prefix="$P" --libdir=lib \
              -Ddefault_library=static -Denable_tools=false -Denable_docs=false -Denable_tests=false -Denable_cuda=false
          fi
          ninja -vC build && ninja -C build install
          mkdir -p "$P/share/libvmaf"
          cp ../LICENSE "$P/share/libvmaf/copyright"
          echo "PKG_CONFIG_PATH=$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

      - name: 编译 AVM AV2 工具
        if: matrix.av2
        shell: bash
        run: bash scripts/ci/build-avm.sh

      - name: 准备 pkg-config 覆盖
        run: bash scripts/ci/prepare-linux-pkgconfig.sh "$HOME/ffmpeg-install"

      - name: 编译 FFmpeg
        run: |
          P="${HOME}/ffmpeg-install"
          CUDA_ARGS=()
          if [ "${{ matrix.cuda }}" = "true" ]; then
            export PATH="${CUDA_HOME}/bin:${PATH}"
            CUDA_ARGS=(--nvcc="$FFMPEG_CUDA_CLANG" --nvccflags="-S -nocudainc -nocudalib --cuda-gpu-arch=sm_75 -O2")
          fi
          cd "$CI_BUILD_ROOT" && git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          cd ffmpeg-src
          ./configure --prefix="$P" --pkg-config-flags="--static" \
            --disable-shared --enable-static \
            --extra-cflags="-I$P/include ${CUDA_HOME:+-I${CUDA_HOME}/include}" \
            --extra-ldflags="-L$P/lib" \
            --extra-libs="-lpthread -lm -ldl -lstdc++" \
            --enable-gpl --enable-version3 --enable-nonfree --enable-lto "${CUDA_ARGS[@]}" \
            ${{ matrix.configure_extra }} --enable-opencl --enable-vulkan \
            --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-libtheora --enable-libaom --enable-libwebp --enable-libass --enable-libfreetype --enable-fontconfig --enable-libzimg --enable-libsoxr --enable-libopenjpeg --enable-libsnappy --enable-libsvtav1 --enable-libdav1d --enable-libkvazaar --enable-libopenh264 --enable-libxvid --enable-libtwolame --enable-libspeex --enable-libcodec2 --enable-libjxl --enable-libopenmpt --enable-libbs2b --enable-libaribb24 --enable-libplacebo --enable-librubberband --enable-libvidstab --enable-sdl2 --disable-doc
          make -j"$(nproc)" && make install

      - name: 失败时导出 ffbuild/config.log
        if: failure()
        run: |
          echo "=== ffbuild/config.log ==="
          cat "$CI_BUILD_ROOT/ffmpeg-src/ffbuild/config.log" 2>/dev/null || echo "(config.log not found)"

      - name: 收集完整依赖源码
        run: |
          set -euo pipefail
          python3 scripts/ci/collect-dependency-sources.py --platform linux \
            --output "$RUNNER_TEMP/dependency-sources" --source-dir "$CI_BUILD_ROOT/ffmpeg-src" \
            --install-root "$HOME/ffmpeg-install"

      - name: 打包、搬移并验证基础包
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/package-base"
          RELOCATED="$RUNNER_TEMP/relocated-base"
          SOURCE_ARGS=()
          if [ -d "$CI_BUILD_ROOT/nv-codec-headers" ]; then SOURCE_ARGS+=(--dependency-source "$CI_BUILD_ROOT/nv-codec-headers"); fi
          python3 scripts/ci/package-runtime.py --platform linux \
            --bin-dir "$HOME/ffmpeg-install/bin" --source-dir "$CI_BUILD_ROOT/ffmpeg-src" \
            --output "$STAGING" --license-dir "$HOME/ffmpeg-install/share" "${SOURCE_ARGS[@]}" \
            --complete-source-dir "$RUNNER_TEMP/dependency-sources"
          mv "$STAGING" "$RELOCATED"
          env -u LD_LIBRARY_PATH python3 scripts/ci/verify-runtime.py --platform linux \
            --directory "$RELOCATED" ${{ matrix.verify_args }} --require-complete-source
          tar -C "$RELOCATED" -cJf "${{ matrix.artifact }}" .

      - name: 打包、搬移并验证 AV2 包
        if: matrix.av2
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/package-av2"
          RELOCATED="$RUNNER_TEMP/relocated-av2"
          SOURCE_ARGS=()
          if [ -d "$CI_BUILD_ROOT/nv-codec-headers" ]; then SOURCE_ARGS+=(--dependency-source "$CI_BUILD_ROOT/nv-codec-headers"); fi
          python3 scripts/ci/package-runtime.py --platform linux \
            --bin-dir "$HOME/ffmpeg-install/bin" --source-dir "$CI_BUILD_ROOT/ffmpeg-src" \
            --output "$STAGING" --license-dir "$HOME/ffmpeg-install/share" "${SOURCE_ARGS[@]}" \
            --avm-prefix "$AVM_PREFIX" --dependency-source "$RUNNER_TEMP/avm" \
            --complete-source-dir "$RUNNER_TEMP/dependency-sources"
          mv "$STAGING" "$RELOCATED"
          env -u LD_LIBRARY_PATH python3 scripts/ci/verify-runtime.py --platform linux \
            --directory "$RELOCATED" ${{ matrix.verify_args }} --avm --require-complete-source
          bash scripts/ci/verify-avm.sh "$RELOCATED/ffmpeg"
          tar -C "$RELOCATED" -cJf "${{ matrix.av2_artifact }}" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.av2
        with:
          name: ${{ matrix.av2_artifact }}
          path: ${{ matrix.av2_artifact }}
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # WINDOWS — Matrix（NVIDIA / AMD AMF / Intel QSV / ARM64 / x86 整合）
  # ============================================================
  windows:
    name: ${{ matrix.name }}
    needs: quality-check
    if: github.event.schedule != '0 14 * * *'
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write    # NuGet readwrite via vcpkg binary cache
    env:
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: nvidia
            name: Windows（NVIDIA NVENC/CUDA）
            runner: windows-2025-vs2026
            msvc_arch: amd64
            triplet: x64-windows-static
            cuda: true
            amf: false
            vpl: false
            configure_extra: --enable-libvmaf --enable-libsvtav1 --enable-ffnvcodec --disable-cuda-nvcc --enable-cuda-llvm --enable-cuvid --enable-nvenc
            verify_args: --require-encoder h264_nvenc --require-encoder hevc_nvenc --require-encoder av1_nvenc
            artifact: ffmpeg-windows-nvidia.zip
          - id: amd-amf
            name: Windows（AMD AMF）
            runner: windows-2025-vs2026
            msvc_arch: amd64
            triplet: x64-windows-static
            cuda: false
            amf: true
            vpl: false
            configure_extra: --enable-libvmaf --enable-libsvtav1 --enable-amf
            verify_args: --require-encoder h264_amf --require-encoder hevc_amf
            artifact: ffmpeg-windows-amd-amf.zip
          - id: intel-qsv
            name: Windows（Intel QSV）
            runner: windows-2025-vs2026
            msvc_arch: amd64
            triplet: x64-windows-static
            cuda: false
            amf: false
            vpl: true
            configure_extra: --enable-libvmaf --enable-libsvtav1 --enable-libvpl
            verify_args: --require-encoder h264_qsv --require-encoder hevc_qsv
            artifact: ffmpeg-windows-intel-qsv.zip
          - id: arm64
            name: Windows ARM64（Snapdragon）
            runner: windows-11-vs2026-arm
            msvc_arch: amd64_arm64
            triplet: arm64-windows-static
            cuda: false
            amf: false
            vpl: false
            # 交叉编译必须 --arch=arm64，否则当成 x86（_tzcnt / x86asm LNK1112）
            configure_extra: --enable-libvmaf --enable-libsvtav1 --arch=arm64 --enable-neon
            artifact: ffmpeg-windows-arm64.zip
            av2: true
            av2_artifact: ffmpeg-windows-arm64-av2.zip
            verify_args: ''
          - id: x86-all
            name: "Windows x86 整合版（NVIDIA + Intel QSV + AMD AMF）"
            runner: windows-2025-vs2026
            msvc_arch: amd64
            triplet: x64-windows-static
            cuda: true
            amf: true
            vpl: true
            configure_extra: --enable-libvmaf --enable-libsvtav1 --enable-ffnvcodec --disable-cuda-nvcc --enable-cuda-llvm --enable-cuvid --enable-nvenc --enable-amf --enable-libvpl
            verify_args: --require-encoder h264_nvenc --require-encoder hevc_nvenc --require-encoder av1_nvenc --require-encoder h264_qsv --require-encoder hevc_qsv --require-encoder h264_amf
            artifact: ffmpeg-windows-x86-all.zip
            av2: true
            av2_artifact: ffmpeg-windows-x86-all-av2.zip
    steps:
      - name: 禁用 Git CRLF 自动转换
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: 准备构建目录
        shell: bash
        run: |
          BUILD_ROOT="$(cygpath -m "$RUNNER_TEMP")/ffmpeg-build"
          mkdir -p "$BUILD_ROOT"
          echo "CI_BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"

      - name: 配置 MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: 安装构建工具
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install -y --no-progress nasm make ninja strawberryperl
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Build tool installation failed: $LASTEXITCODE" }
          python -m pip install meson
          if ($LASTEXITCODE -ne 0) { throw 'Meson installation failed' }
          $nasmDir = $null
          foreach ($d in @("${env:ProgramFiles}\NASM", "${env:ProgramFiles(x86)}\NASM", "C:\ProgramData\chocolatey\bin")) {
            if (Test-Path "$d\nasm.exe") { $nasmDir = $d; break }
          }
          if ($nasmDir) { echo "$nasmDir" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append; Write-Host "nasm: $nasmDir" }
          if (-not $nasmDir) { Write-Host "::warning::nasm.exe not found" }
          echo "C:\ProgramData\chocolatey\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $cleanPath = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Strawberry' }) -join ';'
          [Environment]::SetEnvironmentVariable('PATH', $cleanPath, 'Process')
          echo "PATH=$cleanPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clangDir = $null
          if (Test-Path $vsWhere) {
            $vsPath = & $vsWhere -latest -products * -property installationPath | Select-Object -First 1
            if ($vsPath) {
              $candidates = @((Join-Path $vsPath 'VC\Tools\Llvm\x64\bin'), (Join-Path $vsPath 'VC\Tools\Llvm\bin'))
              foreach ($candidate in $candidates) {
                if ((Test-Path "$candidate\clang.exe") -and (Test-Path "$candidate\clang-cl.exe")) { $clangDir = $candidate; break }
              }
              if (-not $clangDir) {
                $installer = Join-Path (Split-Path $vsWhere) 'setup.exe'
                $process = Start-Process -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$vsPath`"", '--add', 'Microsoft.VisualStudio.Component.VC.Llvm.Clang', '--quiet', '--norestart') -Wait -PassThru
                if ($process.ExitCode -notin @(0, 3010)) { throw "Visual Studio LLVM installation failed: $($process.ExitCode)" }
                foreach ($candidate in $candidates) {
                  if ((Test-Path "$candidate\clang.exe") -and (Test-Path "$candidate\clang-cl.exe")) { $clangDir = $candidate; break }
                }
              }
            }
          }
          if ($clangDir) {
            Write-Host "VS Clang: $clangDir"
            $clangLink = Join-Path $env:CI_BUILD_ROOT 'llvm'
            New-Item -ItemType Junction -Path $clangLink -Target $clangDir -ErrorAction Stop | Out-Null
            $clangDirUnix = $clangLink -replace '\\','/'
            echo "$clangLink" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
            echo "CLANG_BIN=$clangDirUnix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if (-not $clangDir) {
            if ('${{ matrix.cuda }}' -eq 'true' -or '${{ matrix.av2 }}' -eq 'true') { throw 'Visual Studio LLVM clang.exe is required for CUDA PTX and AVM compilation' }
            Write-Host "::warning::VS Clang not found"
          }

      - name: 准备 vcpkg（使用仓库锁定的 builtin-baseline）
        id: vcpkg-prep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'vcpkg.json'
          $json = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $target = [string]$json.'builtin-baseline'
          if (-not $target) { throw 'vcpkg.json missing builtin-baseline' }
          Write-Host "vcpkg baseline (locked): $target"
          echo "VCPKG_BASELINE=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $v = if (Test-Path 'C:\vcpkg') { 'C:\vcpkg' } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          if (-not (Test-Path $v)) {
            git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $v
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          }
          Push-Location $v
          try {
            git remote set-url origin https://github.com/microsoft/vcpkg.git 2>$null
            $head = (git rev-parse HEAD 2>$null)
            if ($head -ne $target) {
              Write-Host "Checking out vcpkg @$target (was $head)"
              git fetch --depth 1 origin $target
              if ($LASTEXITCODE -ne 0) { throw 'vcpkg baseline fetch failed' }
              git checkout --force FETCH_HEAD
              if ($LASTEXITCODE -ne 0) { throw 'vcpkg baseline checkout failed' }
              git reset --hard FETCH_HEAD
              if ($LASTEXITCODE -ne 0) { throw 'vcpkg baseline reset failed' }
            } else {
              Write-Host "vcpkg tree already at $target"
            }
          } finally { Pop-Location }

          $env:VCPKG_ROOT = $v
          echo "VCPKG_ROOT=$v" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$v" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

          $needBootstrap = -not (Test-Path "$v\vcpkg.exe")
          $marker = Join-Path $v '.ffmpeg-bootstrapped-sha'
          $prev = if (Test-Path $marker) { (Get-Content -LiteralPath $marker -Raw).Trim() } else { '' }
          if ($prev -ne $target) { $needBootstrap = $true }
          if ($needBootstrap) {
            $maxRetries = 3
            for ($i = 1; $i -le $maxRetries; $i++) {
              Write-Host "Bootstrapping vcpkg (attempt $i/$maxRetries)..."
              & "$v\bootstrap-vcpkg.bat" -disableMetrics
              if ($LASTEXITCODE -eq 0) {
                Set-Content -LiteralPath $marker -Value $target -NoNewline
                break
              }
              if ($i -eq $maxRetries) { throw "vcpkg bootstrap failed after $maxRetries attempts" }
              Start-Sleep -Seconds 10
            }
          } else {
            Write-Host "Skip bootstrap (vcpkg.exe matches $target)"
          }

      - name: 配置 vcpkg NuGet 缓存
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          $v = $env:VCPKG_ROOT
          if (-not $v) { $v = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } else { "$env:VCPKG_INSTALLATION_ROOT" } }
          if (-not $env:GH_PACKAGES_TOKEN) { Write-Host "::warning::GH_PACKAGES_TOKEN not set, building from source"; exit 0 }
          $vcpkgExe = "$v\vcpkg.exe"
          $nuget = & $vcpkgExe fetch nuget | Where-Object { $_ } | Select-Object -Last 1
          if (-not $nuget) { throw "Failed to fetch vcpkg nuget" }
          Write-Host "nuget: $nuget"
          cmd /c "`"$nuget`" sources Remove -Name GitHubPackages 2>nul || exit /b 0"
          & $nuget sources add -Source "$env:FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "${{ github.repository_owner }}" -Password "$env:GH_PACKAGES_TOKEN"
          & $nuget setapikey "$env:GH_PACKAGES_TOKEN" -Source "$env:FEED_URL"
          echo "VCPKG_BINARY_SOURCES=clear;nuget,$env:FEED_URL,readwrite" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        continue-on-error: true

      - name: 安装 vcpkg 依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:VCPKG_ROOT
          if (-not $v) { $v = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } else { "$env:VCPKG_INSTALLATION_ROOT" } }
          $env:VCPKG_ROOT = $v
          if (-not $env:VCPKG_BINARY_SOURCES) { $env:VCPKG_BINARY_SOURCES = 'clear;default,readwrite' }
          $env:Path = "$v;" + $env:Path
          $inst = "$env:GITHUB_WORKSPACE\vcpkg_installed\${{ matrix.triplet }}"
          $instUnix = $inst -replace '\\', '/'
          echo "VCPKG_INSTALLED=$instUnix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "vcpkg install @ $($env:VCPKG_BASELINE) triplet=${{ matrix.triplet }}"
          for ($i = 1; $i -le 3; $i++) {
            Write-Output "Installing vcpkg packages (attempt $i/3)..."
            & "$v\vcpkg.exe" install --triplet ${{ matrix.triplet }} --x-manifest-root=$env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { throw "vcpkg install failed after 3 attempts" }
            Write-Output "Install failed, retrying in 10s..."
            Start-Sleep -Seconds 10
          }

          if ('${{ matrix.vpl }}' -eq 'true') {
            ./scripts/ci/write-fallback-pc.ps1 -InstallRoot "$inst" -HasVpl
          } else {
            ./scripts/ci/write-fallback-pc.ps1 -InstallRoot "$inst"
          }

      - name: 从源码编译 zimg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'zimg-build'
          New-Item -ItemType Directory -Path $buildRoot -ErrorAction Stop | Out-Null
          ./scripts/ci/build-zimg-windows.ps1 -InstallRoot $env:VCPKG_INSTALLED -BuildRoot $buildRoot

      - name: 检查 vcpkg pkg-config
        shell: bash
        run: |
          __clean_path() { local __new="" __e; IFS=':' read -ra __entries <<< "$PATH"; for __e in "${__entries[@]}"; do case "$__e" in *[Ss]trawberry*) ;; *) __new="${__new:+${__new}:}${__e}" ;; esac; done; export PATH="$__new"; }
          __clean_path
          # 优先用 PKG_CONFIG_DIR（vcpkg manifest 模式），回退到全局 PKG_CONFIG
          if [ -z "${PKG_CONFIG:-}" ] && [ -n "${PKG_CONFIG_DIR:-}" ]; then
            PKG_CONFIG="${PKG_CONFIG_DIR}/pkg-config.exe"
            [ ! -f "$PKG_CONFIG" ] && PKG_CONFIG="${PKG_CONFIG_DIR}/pkgconf.exe"
          fi
          [ -z "${PKG_CONFIG:-}" ] && PKG_CONFIG="$(which pkg-config 2>/dev/null || echo)"
          echo "PKG_CONFIG=${PKG_CONFIG:-未设置}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          echo "--- .pc files ---"
          find "${VCPKG_INSTALLED}/lib/pkgconfig" -name '*.pc' -print0 2>/dev/null | xargs -0 -I{} sh -c 'echo "== {} =="; cat "{}"' || true
          echo "--- pkg-config checks ---"
          if [ -n "${PKG_CONFIG:-}" ] && [ -x "$PKG_CONFIG" ]; then
            $PKG_CONFIG --exists sdl2 && echo "sdl2 OK: version=$($PKG_CONFIG --modversion sdl2) libs=$($PKG_CONFIG --libs sdl2) cflags=$($PKG_CONFIG --cflags sdl2)" || echo "未找到 sdl2"
            $PKG_CONFIG --exists vpl && echo "vpl OK: version=$($PKG_CONFIG --modversion vpl) libs=$($PKG_CONFIG --libs vpl) cflags=$($PKG_CONFIG --cflags vpl)" || echo "未找到 vpl"
            $PKG_CONFIG --exists zimg && echo "zimg OK: version=$($PKG_CONFIG --modversion zimg) libs=$($PKG_CONFIG --libs zimg) cflags=$($PKG_CONFIG --cflags zimg)" || echo "未找到 zimg"
            $PKG_CONFIG --exists aom && echo "aom OK: version=$($PKG_CONFIG --modversion aom) libs=$($PKG_CONFIG --libs aom) cflags=$($PKG_CONFIG --cflags aom)" || echo "未找到 aom"
          else
            echo "pkg-config 未找到，跳过检查"
          fi

      - name: 安装最新 CUDA 工具包
        id: cuda
        if: matrix.cuda
        uses: mjun0812/setup-cuda@v1
        with:
          version: 'latest'
          method: 'auto'

      - name: CUDA LLVM 检测
        if: matrix.cuda && matrix.cuda_strategy == 'llvm'
        shell: bash
        run: |
          CUDA_BASE="${CUDA_HOME:-${CUDA_PATH:-}}"
          CUDA_BASE="$(cygpath -u "$CUDA_BASE")"
          [ -x "${CUDA_BASE}/bin/nvcc.exe" ] || { echo "::error::Action 未提供有效 CUDA 路径"; exit 1; }
          [ -z "${CUDA_BASE}" ] && { echo "::error::未找到 CUDA"; exit 1; }
          echo "CUDA_HOME=${CUDA_BASE}" >> "${GITHUB_ENV}"
          "${CUDA_BASE}/bin/nvcc.exe" --version
          CUDA_CLANG="$(cygpath -u "${CLANG_BIN}/clang.exe")"
          [ -x "$CUDA_CLANG" ] || { echo "::error::Visual Studio LLVM clang.exe is required"; exit 1; }
          "$CUDA_CLANG" --print-targets | grep -q nvptx || { echo "::error::Visual Studio Clang lacks the NVPTX backend"; exit 1; }
          WORK="$(cygpath -m "$RUNNER_TEMP")"
          printf '%s\n' '__attribute__((global)) void ffmpeg_cuda_probe(void) {}' > "$WORK/ffmpeg-cuda-probe.cu"
          "$CUDA_CLANG" -S -x cuda --cuda-device-only -nocudainc -nocudalib --cuda-gpu-arch=sm_75 \
            "$WORK/ffmpeg-cuda-probe.cu" -o "$WORK/ffmpeg-cuda-probe.ptx"
          grep -q '\.entry' "$WORK/ffmpeg-cuda-probe.ptx"

      - name: 创建 CUDA junction
        if: matrix.cuda
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cuda = $env:CUDA_HOME
          if (-not $cuda) { Write-Error "CUDA_HOME is not set"; exit 1 }
          if ($cuda -match '^/([a-zA-Z])/(.*)$') {
            $cuda = "$($matches[1].ToUpper()):\$($matches[2])" -replace '/', '\\'
          } elseif ($cuda -match '^[a-zA-Z]:') {
            $cuda = $cuda -replace '/', '\\'
          }
          $link = Join-Path $env:RUNNER_TEMP 'cuda'
          if (Test-Path -LiteralPath $link) { throw "Refusing to replace existing CUDA path: $link" }
          New-Item -ItemType Junction -Path $link -Target $cuda -ErrorAction Stop | Out-Null
          if (-not (Test-Path "$link\bin\nvcc.exe")) { throw 'CUDA junction validation failed' }
          $mixed = $link -replace '\\', '/'
          echo "CUDA_HOME_MIXED=$mixed" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CUDA junction: $link -> $cuda"

      - name: 编译 nv-codec-headers
        if: matrix.cuda
        shell: bash
        run: |
          P="${HOME}/ffmpeg-install"
          P_MIXED="$(cygpath -m "$P" 2>/dev/null || echo "$P")"
          cd "$CI_BUILD_ROOT" && git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers
          cd nv-codec-headers
          make -j"$(nproc)" PREFIX="$P" && make PREFIX="$P" install
          mkdir -p "$P/share/nv-codec-headers"
          cp include/ffnvcodec/nvEncodeAPI.h "$P/share/nv-codec-headers/copyright"
          echo "PKG_CONFIG_PATH=$P_MIXED/lib/pkgconfig;${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

      - name: 编译 VMAF
        shell: bash
        run: |
          set -euo pipefail
          P="${HOME}/ffmpeg-install"
          P_MIXED="$(cygpath -m "$P")"
          cd "$CI_BUILD_ROOT" && git clone --depth 1 https://github.com/Netflix/vmaf.git
          cd vmaf/libvmaf
          COMPAT="$(cygpath -m "$CI_BUILD_ROOT")/vmaf-compat"
          COMPAT_WIN="$(cygpath -w "$COMPAT")"
          # Git for Windows 的 usr/bin/link.exe 会遮蔽 MSVC 的 link.exe，
          # Meson 检测到非 MSVC linker 会直接报错，这里把工具链目录提前。
          if [ -n "${VCToolsInstallDir:-}" ]; then
            export PATH="$(cygpath -u "${VCToolsInstallDir%/}")/bin/Host${VSCMD_ARG_HOST_ARCH}/${VSCMD_ARG_TGT_ARCH}:$PATH"
          fi
          ARCH="${VSCMD_ARG_TGT_ARCH:-x64}"
          PREPARE_ARGS=(--architecture "$ARCH")
          if [ "${{ matrix.cuda }}" = "true" ]; then
            PREPARE_ARGS+=(--cuda --include-dir "$P_MIXED/include" --include-dir "$VCPKG_INSTALLED/include")
            export CUDA_HOME="$(cygpath -u "$CUDA_HOME_MIXED")"
            export CUDA_PATH="$CUDA_HOME_MIXED" CUDACXX="$CUDA_HOME_MIXED/bin/nvcc.exe"
            export PATH="$CUDA_HOME/bin:${PATH}"
          fi
          python3 "$GITHUB_WORKSPACE/scripts/ci/prepare-vmaf-windows.py" . "$COMPAT" "${PREPARE_ARGS[@]}"
          mkdir -p "$P/lib" "$P/lib/pkgconfig" "$P/include/libvmaf" "$P/share/libvmaf"
          # MSYS2 会把含 /a/_temp 形式的分片路径改写成 A:\...，cl.exe 因此无法打开 -Fo 输出；
          # 这里统一用原生 Windows 路径并禁用参数转换。
          MSYS2_ARG_CONV_EXCL='*' cl.exe -MT -nologo -c "-I$COMPAT_WIN" "-Fo$COMPAT_WIN\\pthread_shim.obj" "$COMPAT_WIN\\pthread_shim.c"
          MSYS2_ARG_CONV_EXCL='*' lib.exe -nologo "-out:$P_MIXED/lib/pthread_shim.lib" "$COMPAT_WIN\\pthread_shim.obj"
          export INCLUDE="$COMPAT;$P_MIXED/include;$VCPKG_INSTALLED/include;${INCLUDE:-}"
          export PKG_CONFIG_PATH="$P_MIXED/lib/pkgconfig;$VCPKG_INSTALLED/lib/pkgconfig;${PKG_CONFIG_PATH:-}"
          export CC=cl.exe CXX=cl.exe
          VMAF_ENABLE_ASM=false
          VMAF_C_ARGS="-I$COMPAT -I$P_MIXED/include -I$VCPKG_INSTALLED/include -D_USE_MATH_DEFINES -D_CRT_SECURE_NO_WARNINGS -DHAVE_ALLOCA_H=0 -DHAVE_STRSEP=0"
          VMAF_CPP_ARGS="$VMAF_C_ARGS"
          if [ "$ARCH" = "arm64" ]; then
            # VMAF 的 ARM64 NEON 是 C intrinsics，用到 __builtin_clz 等 GCC 内建，
            # MSVC 没有这些内建，开启 ASM 会链接失败。
            VMAF_ENABLE_ASM=false
            VMAF_C_ARGS="$VMAF_C_ARGS -DHAVE_FEATURES_H=0 -DHAVE_LOCALTIME_R=0 -DHAVE_LOCALTIME_S=1 -experimental:c11atomics"
            VMAF_CPP_ARGS="$VMAF_CPP_ARGS -std:c++14"
          elif [ -n "${CLANG_BIN:-}" ] && [ -f "$CLANG_BIN/clang-cl.exe" ] && command -v nasm >/dev/null 2>&1; then
            export CC="$CLANG_BIN/clang-cl.exe" CXX="$CLANG_BIN/clang-cl.exe"
            VMAF_ENABLE_ASM=true
            VMAF_CPP_ARGS="$VMAF_CPP_ARGS /clang:-std=c++14"
          else
            VMAF_C_ARGS="$VMAF_C_ARGS -experimental:c11atomics"
            VMAF_CPP_ARGS="$VMAF_CPP_ARGS -std:c++14"
            echo "::warning::VMAF x86 assembly requires Clang and NASM"
          fi
          meson setup build --buildtype release --prefix="$P_MIXED" --libdir=lib \
            -Denable_cuda=${{ matrix.cuda }} -Denable_asm=$VMAF_ENABLE_ASM \
            -Denable_tools=false -Denable_docs=false -Denable_tests=false -Db_vscrt=mt -Ddefault_library=static \
            "-Dc_args=$VMAF_C_ARGS" "-Dcpp_args=$VMAF_CPP_ARGS" -Dcpp_std=c++14
          vmaf_target=$(ninja -C build -t targets all | awk '/^src\/(libvmaf\.a|vmaf\.lib|libvmaf\.lib):/ && !found { sub(/:.*/, ""); print; found=1 }')
          [ -n "$vmaf_target" ] || { echo "::error::VMAF static target not found"; exit 1; }
          ninja -vC build "$vmaf_target" 2>&1 | tee "$CI_BUILD_ROOT/ninja-vmaf.log"
          vmaf_static_lib=""
          for cand in build/src/libvmaf.a build/src/vmaf.lib build/src/libvmaf.lib; do
            [ -f "$cand" ] && { vmaf_static_lib="$cand"; break; }
          done
          [ -n "$vmaf_static_lib" ] || { echo "::error::VMAF static library not found"; exit 1; }
          cp "$vmaf_static_lib" "$P/lib/vmaf.lib"
          cp include/libvmaf/*.h "$P/include/libvmaf/"
          for header in build/include/version.h build/include/libvmaf/version.h; do
            if [ -f "$header" ]; then cp "$header" "$P/include/libvmaf/"; fi
          done
          VMAF_VERSION=$(python3 -c "import json; print(json.load(open('build/meson-info/intro-projectinfo.json'))['version'])")
          VMAF_PRIVATE_LIBS="-lpthread_shim -ladvapi32"
          if [ "${{ matrix.cuda }}" = "true" ]; then
            VMAF_PRIVATE_LIBS="-L${CUDA_HOME_MIXED}/lib/x64 -lcuda $VMAF_PRIVATE_LIBS"
          fi
          printf '%s\n' \
            "prefix=$P_MIXED" 'exec_prefix=${prefix}' 'libdir=${prefix}/lib' 'includedir=${prefix}/include' \
            '' 'Name: libvmaf' 'Description: VMAF library' "Version: $VMAF_VERSION" \
            'Libs: -L${libdir} -lvmaf' "Libs.private: $VMAF_PRIVATE_LIBS" \
            'Cflags: -I${includedir} -I${includedir}/libvmaf' > "$P/lib/pkgconfig/libvmaf.pc"
          cp ../LICENSE "$P/share/libvmaf/copyright"
          echo "PKG_CONFIG_PATH=$P_MIXED/lib/pkgconfig;${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: 导出 VMAF meson 日志
        if: failure()
        shell: bash
        run: |
          if [ -f "$CI_BUILD_ROOT/vmaf/libvmaf/build/meson-logs/meson-log.txt" ]; then
            echo "=== VMAF meson-log.txt ==="
            cat "$CI_BUILD_ROOT/vmaf/libvmaf/build/meson-logs/meson-log.txt"
          fi
      - name: 导出 VMAF ninja 日志
        if: failure()
        shell: bash
        run: |
          if [ -f "$CI_BUILD_ROOT/ninja-vmaf.log" ]; then
            echo "=== VMAF ninja log ==="
            cat "$CI_BUILD_ROOT/ninja-vmaf.log"
          fi

      - name: 编译 AVM AV2 工具
        if: matrix.av2
        shell: pwsh
        run: ./scripts/ci/build-avm-windows.ps1

      - name: 编译 FFmpeg
        shell: bash
        run: |
          __clean_path() { local __new="" __e; IFS=':' read -ra __entries <<< "$PATH"; for __e in "${__entries[@]}"; do case "$__e" in *[Ss]trawberry*) ;; *) __new="${__new:+${__new}:}${__e}" ;; esac; done; export PATH="$__new"; }
          __clean_path
          set -e; P="${HOME}/ffmpeg-install"
          P_MIXED="$(cygpath -m "$P" 2>/dev/null || echo "$P")"
          # 从 PKG_CONFIG_DIR 找 pkg-config（不用全局 PKG_CONFIG，避免 Meson 误解析）
          PKG_CONFIG="${PKG_CONFIG_DIR:-$(dirname "$(which pkg-config 2>/dev/null)" 2>/dev/null)}/pkg-config.exe"
          [ ! -f "$PKG_CONFIG" ] && PKG_CONFIG="${PKG_CONFIG_DIR:-$(dirname "$(which pkgconf 2>/dev/null)" 2>/dev/null)}/pkgconf.exe"
          [ ! -f "$PKG_CONFIG" ] && { echo "::error::PKG_CONFIG 未找到"; exit 1; }
          if command -v cygpath >/dev/null 2>&1; then
            PKG_CONFIG="$(cygpath -u "$PKG_CONFIG")"
          fi
          export PKG_CONFIG
          export PKG_CONFIG_PATH="$P_MIXED/lib/pkgconfig;${VCPKG_INSTALLED}/lib/pkgconfig;${PKG_CONFIG_PATH:-}"
          cd "$CI_BUILD_ROOT"
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          python3 "${GITHUB_WORKSPACE}/scripts/ci/patch-ffmpeg-msvc.py" "$CI_BUILD_ROOT/ffmpeg-src"
          cd ffmpeg-src
          # CUDA PTX uses LLVM; nvcc remains available only for the VMAF CUDA library.
          CUDA_ARGS=()
          if [ "${{ matrix.cuda }}" = "true" ]; then
            CUDA_ARGS=(--nvcc="${CLANG_BIN}/clang.exe" --nvccflags="-S -nocudainc -nocudalib --cuda-gpu-arch=sm_75 -O2")
            export CUDA_HOME="$(cygpath -u "$CUDA_HOME_MIXED")"
            export CUDA_PATH="$CUDA_HOME_MIXED"
            export CUDACXX="$CUDA_HOME_MIXED/bin/nvcc.exe"
            export PATH="$CUDA_HOME/bin:${PATH}"
            CL="${CUDA_HOME_MIXED}/lib/x64"; [ ! -d "$CUDA_HOME/lib/x64" ] && CL="${CUDA_HOME_MIXED}/lib"
          fi
          if [ "${{ matrix.amf }}" = "true" ]; then
            AMF_DIR="$CI_BUILD_ROOT/AMF"
            [ ! -d "$AMF_DIR" ] && git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git "$AMF_DIR"
            AMF_INCLUDE_DIR="$AMF_DIR/amf/public/include"
            if [ ! -d "$AMF_INCLUDE_DIR/AMF" ]; then
              mkdir -p "$AMF_INCLUDE_DIR/AMF"
              cp -r "$AMF_INCLUDE_DIR/core" "$AMF_INCLUDE_DIR/components" "$AMF_INCLUDE_DIR/AMF/"
            fi
            AMF_INCLUDE="$(cygpath -m "$AMF_INCLUDE_DIR")"
          fi
          # 交叉 ARM64：摘掉 x64 nasm；装 gas-preprocessor（armasm64 编 NEON 汇编需要）
          if [ "${VSCMD_ARG_TGT_ARCH:-}" = "arm64" ] || [ "${VSCMD_ARG_TGT_ARCH:-}" = "arm" ]; then
            __clean_nasm() { local __new="" __e; IFS=':' read -ra __entries <<< "$PATH"; for __e in "${__entries[@]}"; do case "$__e" in *[Nn][Aa][Ss][Mm]*) ;; *[Yy][Aa][Ss][Mm]*) ;; *) __new="${__new:+${__new}:}${__e}" ;; esac; done; export PATH="$__new"; }
            __clean_nasm
            hash -r 2>/dev/null || true
            GAS_BIN="${HOME}/bin"
            mkdir -p "$GAS_BIN"
            curl -fsSL -o "$GAS_BIN/gas-preprocessor.pl" \
              https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/master/gas-preprocessor.pl
            PERL=""
            for c in \
              "/c/Program Files/Git/usr/bin/perl.exe" \
              "/usr/bin/perl" \
              "/c/Strawberry/perl/bin/perl.exe" \
              "$(command -v perl 2>/dev/null || true)"; do
              if [ -n "$c" ] && [ -x "$c" ]; then PERL="$c"; break; fi
            done
            if [ -z "$PERL" ]; then
              echo "::error::perl not found (gas-preprocessor needs perl for armasm64)"
              exit 1
            fi
            # 包装：MSYS 下 shebang 不可靠，用 perl 显式调用
            mv "$GAS_BIN/gas-preprocessor.pl" "$GAS_BIN/gas-preprocessor.pl.bin"
            printf '%s\n' "#!/bin/sh" "exec \"$PERL\" \"$GAS_BIN/gas-preprocessor.pl.bin\" \"\$@\"" \
              > "$GAS_BIN/gas-preprocessor.pl"
            chmod +x "$GAS_BIN/gas-preprocessor.pl" "$GAS_BIN/gas-preprocessor.pl.bin"
            export PATH="$GAS_BIN:${PATH}"
            command -v gas-preprocessor.pl
            command -v armasm64 || command -v armasm64.exe || echo "::warning::armasm64 not in PATH yet"
            gas-preprocessor.pl -arch aarch64 -as-type armasm -- armasm64 -h >/dev/null 2>&1 \
              || gas-preprocessor.pl -arch aarch64 -as-type armasm -- armasm64.exe -h \
              || { echo "::error::gas-preprocessor + armasm64 smoke test failed"; exit 1; }
          fi
          # NVIDIA 光流插帧滤镜 fruc_vulkan 依赖 SPIR-V 编译器（glslc），
          # vcpkg 的 shaderc port 把 glslc.exe 放在 tools/shaderc/ 下，需显式加入 PATH，
          # 否则 configure 的 spirv_compiler 检测失败导致 fruc_vulkan 被禁用。
          if [ -d "${VCPKG_INSTALLED}/tools/shaderc" ]; then
            GLSLC_DIR="$(cygpath -m "${VCPKG_INSTALLED}/tools/shaderc")"
            export PATH="${GLSLC_DIR}:${PATH}"
            echo "glslc dir: ${GLSLC_DIR}"
          fi
          command -v glslc >/dev/null 2>&1 && echo "glslc: $(which glslc)" || echo "::warning::glslc not found in PATH"
          ./configure --toolchain=msvc --prefix="$P" \
            --pkg-config="$PKG_CONFIG" \
            --pkg-config-flags="--static" \
            --extra-cflags="-MT -I$P_MIXED/include -I${VCPKG_INSTALLED}/include ${CUDA_HOME_MIXED:+-I${CUDA_HOME_MIXED}/include} ${AMF_INCLUDE:+-I${AMF_INCLUDE}} -I${VCPKG_INSTALLED}/include/vpl -DLIBTWOLAME_STATIC" \
            --extra-ldflags="-LIBPATH:$P_MIXED/lib ${CL:+-LIBPATH:$CL} -LIBPATH:${VCPKG_INSTALLED}/lib" \
            --extra-libs="advapi32.lib ole32.lib ws2_32.lib user32.lib bcrypt.lib cfgmgr32.lib gdi32.lib shell32.lib libcpmt.lib" \
            --disable-shared --enable-static \
            --enable-gpl --enable-version3 --enable-nonfree "${CUDA_ARGS[@]}" \
            ${{ matrix.configure_extra }} --enable-opencl --enable-vulkan \
            --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-libtheora --enable-libaom --enable-libwebp --enable-libass --enable-libfreetype --enable-fontconfig --enable-libzimg --enable-libsoxr --enable-libopenjpeg --enable-libsnappy --enable-libdav1d --enable-libopenh264 --enable-libtwolame --enable-libspeex --enable-libjxl --enable-sdl2 --enable-d3d11va --enable-d3d12va --enable-dxva2 --enable-mediafoundation --disable-doc
          make -j"$(nproc)" && make install

      - name: 失败时导出 ffbuild/config.log
        if: failure()
        shell: bash
        run: |
          echo "=== ffbuild/config.log ==="
          cat "$CI_BUILD_ROOT/ffmpeg-src/ffbuild/config.log" 2>/dev/null || echo "(config.log not found)"
          echo "=== pkg-config vpl ==="
          ${PKG_CONFIG:-true} --debug vpl 2>&1 | head -40 || true

      - name: 收集完整依赖源码
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/ci/collect-dependency-sources.py --platform windows `
            --output "$env:RUNNER_TEMP\dependency-sources" --source-dir "$env:CI_BUILD_ROOT\ffmpeg-src" `
            --install-root "$env:USERPROFILE\ffmpeg-install" `
            --vcpkg-root $env:VCPKG_ROOT --vcpkg-installed $env:VCPKG_INSTALLED `
            --manifest-root "$env:GITHUB_WORKSPACE" --triplet ${{ matrix.triplet }}
          if ($LASTEXITCODE -ne 0) { throw 'Complete dependency-source collection failed' }

      - name: 打包、搬移并验证基础包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "$env:USERPROFILE\ffmpeg-install\bin"
          $source = "$env:CI_BUILD_ROOT\ffmpeg-src"
          $staging = Join-Path $env:RUNNER_TEMP 'package-base'
          $relocated = Join-Path $env:RUNNER_TEMP 'relocated-base'
          $sourceArgs = @('--dependency-source', "$env:RUNNER_TEMP\zimg-build\zimg-src", '--dependency-source', "$env:CI_BUILD_ROOT\vmaf-compat")
          foreach ($dependency in @('nv-codec-headers', 'AMF')) {
            $path = Join-Path $env:CI_BUILD_ROOT $dependency
            if (Test-Path -LiteralPath $path) { $sourceArgs += @('--dependency-source', $path) }
          }
          python scripts/ci/package-runtime.py --platform windows --bin-dir $bin --source-dir $source `
            --output $staging @sourceArgs --license-dir "$env:VCPKG_INSTALLED\share" --license-dir "$env:USERPROFILE\ffmpeg-install\share" `
            --complete-source-dir "$env:RUNNER_TEMP\dependency-sources"
          if ($LASTEXITCODE -ne 0) { throw 'Base runtime packaging failed' }
          Move-Item -LiteralPath $staging -Destination $relocated -ErrorAction Stop
          python scripts/ci/verify-runtime.py --platform windows --directory $relocated ${{ matrix.verify_args }} --require-complete-source
          if ($LASTEXITCODE -ne 0) { throw 'Relocated base runtime verification failed' }
          Compress-Archive -Path "$relocated\*" -DestinationPath '${{ matrix.artifact }}' -Force

      - name: 打包、搬移并验证 AV2 包
        if: matrix.av2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "$env:USERPROFILE\ffmpeg-install\bin"
          $source = "$env:CI_BUILD_ROOT\ffmpeg-src"
          $staging = Join-Path $env:RUNNER_TEMP 'package-av2'
          $relocated = Join-Path $env:RUNNER_TEMP 'relocated-av2'
          $sourceArgs = @('--dependency-source', "$env:RUNNER_TEMP\zimg-build\zimg-src", '--dependency-source', "$env:CI_BUILD_ROOT\vmaf-compat")
          foreach ($dependency in @('nv-codec-headers', 'AMF')) {
            $path = Join-Path $env:CI_BUILD_ROOT $dependency
            if (Test-Path -LiteralPath $path) { $sourceArgs += @('--dependency-source', $path) }
          }
          python scripts/ci/package-runtime.py --platform windows --bin-dir $bin --source-dir $source `
            --output $staging @sourceArgs --license-dir "$env:VCPKG_INSTALLED\share" --license-dir "$env:USERPROFILE\ffmpeg-install\share" `
            --avm-prefix $env:AVM_PREFIX --dependency-source "$env:RUNNER_TEMP\avm" `
            --complete-source-dir "$env:RUNNER_TEMP\dependency-sources"
          if ($LASTEXITCODE -ne 0) { throw 'AV2 runtime packaging failed' }
          Move-Item -LiteralPath $staging -Destination $relocated -ErrorAction Stop
          python scripts/ci/verify-runtime.py --platform windows --directory $relocated ${{ matrix.verify_args }} --avm --require-complete-source
          if ($LASTEXITCODE -ne 0) { throw 'Relocated AV2 runtime verification failed' }
          ./scripts/ci/verify-avm.ps1 -Ffmpeg "$relocated\ffmpeg.exe"
          Compress-Archive -Path "$relocated\*" -DestinationPath '${{ matrix.av2_artifact }}' -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.av2
        with:
          name: ${{ matrix.av2_artifact }}
          path: ${{ matrix.av2_artifact }}
          retention-days: 30
          if-no-files-found: error

  macos-arm:
    name: ${{ matrix.name }}
    needs: quality-check
    if: github.event.schedule != '0 14 * * *'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM（VideoToolbox + AV2 工具）
            av2: true
            artifact: ffmpeg-macos-arm.tar.xz
            av2_artifact: ffmpeg-macos-arm-av2.tar.xz
            verify_args: --require-encoder h264_videotoolbox --require-encoder hevc_videotoolbox
    steps:
      - uses: actions/checkout@v7
      - name: 准备构建目录
        run: |
          BUILD_ROOT="${RUNNER_TEMP}/ffmpeg-build"
          mkdir -p "$BUILD_ROOT"
          echo "CI_BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: |
          brew install yasm nasm pkg-config meson ninja cmake wget sdl2 x264 x265 libvpx opus libvorbis theora aom webp libass freetype fontconfig zimg libsoxr openjpeg snappy molten-vk shaderc svt-av1 dav1d kvazaar openh264 xvid twolame speex codec2 jpeg-xl libopenmpt libbs2b aribb24 libplacebo rubberband libvidstab

      - name: 编译 VMAF（CPU）
        run: |
          # 显式传入 Apple SDK，避免 Meson 的 clang 编译探测缺少系统头文件。
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="clang"
          export CXX="clang++"
          export OBJC="clang"
          export CFLAGS="${CFLAGS:-} -isysroot ${SDKROOT}"
          export CXXFLAGS="${CXXFLAGS:-} -isysroot ${SDKROOT}"
          export LDFLAGS="${LDFLAGS:-} -isysroot ${SDKROOT}"
          echo "Apple Clang: $(clang --version | sed -n '1p')"
          echo "SDKROOT=${SDKROOT}"
          P="${HOME}/ffmpeg-install"
          cd "$CI_BUILD_ROOT" && git clone --depth 1 https://github.com/Netflix/vmaf.git
          cd vmaf/libvmaf && rm -rf build
          PKG_CONFIG_PATH="$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
          CC="$CC" CXX="$CXX" CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS" \
          meson setup build --buildtype release --prefix="$P" --libdir=lib \
            -Ddefault_library=static -Denable_tools=false -Denable_docs=false -Denable_tests=false -Denable_cuda=false
          ninja -vC build && ninja -C build install
          # 静态 libvmaf 内嵌 C++ 对象（libsvm），meson 生成的 .pc 不带 libc++，
          # configure 的 vmaf_init 检测会因 std::__1::* 未定义而失败。
          VMAF_VERSION=$(python3 -c "import json; print(json.load(open('build/meson-info/intro-projectinfo.json'))['version'])")
          printf '%s\n' \
            "prefix=$P" 'exec_prefix=${prefix}' 'libdir=${prefix}/lib' 'includedir=${prefix}/include' \
            '' 'Name: libvmaf' 'Description: VMAF library' "Version: $VMAF_VERSION" \
            'Libs: -L${libdir} -lvmaf -lc++' 'Libs.private: -lpthread -lm' \
            'Cflags: -I${includedir} -I${includedir}/libvmaf' > "$P/lib/pkgconfig/libvmaf.pc"
          mkdir -p "$P/share/libvmaf"
          cp ../LICENSE "$P/share/libvmaf/copyright"
          echo "PKG_CONFIG_PATH=$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

      - name: 编译 AVM AV2 工具
        if: matrix.av2
        shell: bash
        run: bash scripts/ci/build-avm.sh

      - name: 编译 FFmpeg
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="clang"
          export CXX="clang++"
          export OBJC="clang"
          export CFLAGS="${CFLAGS:-} -isysroot ${SDKROOT}"
          export CXXFLAGS="${CXXFLAGS:-} -isysroot ${SDKROOT}"
          export LDFLAGS="${LDFLAGS:-} -isysroot ${SDKROOT}"
          echo "Apple Clang: $(clang --version | sed -n '1p')"
          echo "SDKROOT=${SDKROOT}"
          P="${HOME}/ffmpeg-install"
          BREW_PREFIX="$(brew --prefix)"
          MVK_PREFIX="$(brew --prefix molten-vk 2>/dev/null || true)"
          if [ -d "${MVK_PREFIX}/libexec/include" ]; then
            MVK_CFLAGS="-I${MVK_PREFIX}/libexec/include"
            MVK_LDFLAGS="-L${MVK_PREFIX}/lib"
          else
            MVK_CFLAGS=""
            MVK_LDFLAGS=""
          fi
          # 复制并修复 Homebrew 的 .pc（macOS 没有 libstdc++）
          for pc_dir in "${BREW_PREFIX}/lib/pkgconfig" /opt/homebrew/opt/*/lib/pkgconfig; do
            [ -d "$pc_dir" ] || continue
            for pc in "$pc_dir"/*.pc; do
              [ -f "$pc" ] || continue
              base=$(basename "$pc")
              [ "$base" != libvmaf.pc ] || continue
              sed 's/-lstdc++/-lc++/g' "$pc" > "${P}/lib/pkgconfig/$base"
            done
          done
          export PKG_CONFIG_PATH="${P}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"
          cd "$CI_BUILD_ROOT" && git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          cd ffmpeg-src
          # macOS 使用 libc++，configure 里 libsnappy 的 -lstdc++ 会导致检测失败
          sed -i.bak 's/require libsnappy snappy-c.h snappy_compress -lsnappy -lstdc++/require libsnappy snappy-c.h snappy_compress -lsnappy/' configure
          rm -f configure.bak
          ./configure --prefix="$P" \
            --cc="$CC" --cxx="$CXX" \
            --extra-cflags="-isysroot ${SDKROOT} -I$P/include -I${BREW_PREFIX}/include ${MVK_CFLAGS}" \
            --extra-ldflags="-isysroot ${SDKROOT} -L$P/lib -L${BREW_PREFIX}/lib ${MVK_LDFLAGS}" \
            --extra-libs="-lpthread -lm" \
            --disable-shared --enable-static \
            --enable-gpl --enable-version3 --enable-nonfree --enable-lto \
            --enable-libvmaf --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-libtheora --enable-libaom --enable-libwebp --enable-libass --enable-libfreetype --enable-fontconfig --enable-libzimg --enable-libsoxr --enable-libopenjpeg --enable-libsnappy --enable-opencl --enable-vulkan \
            --enable-libsvtav1 --enable-libdav1d --enable-libkvazaar --enable-libopenh264 --enable-libxvid --enable-libtwolame --enable-libspeex --enable-libcodec2 --enable-libjxl --enable-libopenmpt --enable-libbs2b --enable-libaribb24 --enable-libplacebo --enable-librubberband --enable-libvidstab \
            --enable-sdl2 --enable-videotoolbox --enable-audiotoolbox \
            --enable-hwaccel=h264_videotoolbox --enable-hwaccel=hevc_videotoolbox \
            --enable-hwaccel=vp9_videotoolbox --enable-hwaccel=prores_videotoolbox \
            --enable-hwaccel=av1_videotoolbox --disable-doc
          make -j"$(sysctl -n hw.logicalcpu)" && make install

      - name: 失败时导出 ffbuild/config.log
        if: failure()
        run: |
          echo "=== ffbuild/config.log ==="
          cat "$CI_BUILD_ROOT/ffmpeg-src/ffbuild/config.log" 2>/dev/null || echo "(config.log not found)"

      - name: 收集完整依赖源码
        run: |
          set -euo pipefail
          python3 scripts/ci/collect-dependency-sources.py --platform macos \
            --output "$RUNNER_TEMP/dependency-sources" --source-dir "$CI_BUILD_ROOT/ffmpeg-src" \
            --install-root "$HOME/ffmpeg-install"

      - name: 打包、搬移并验证基础包
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/package-base"
          RELOCATED="$RUNNER_TEMP/relocated-base"
          python3 scripts/ci/package-runtime.py --platform macos \
            --bin-dir "$HOME/ffmpeg-install/bin" --source-dir "$CI_BUILD_ROOT/ffmpeg-src" \
            --output "$STAGING" --license-dir "$HOME/ffmpeg-install/share" \
            --complete-source-dir "$RUNNER_TEMP/dependency-sources"
          mv "$STAGING" "$RELOCATED"
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH python3 scripts/ci/verify-runtime.py --platform macos \
            --directory "$RELOCATED" ${{ matrix.verify_args }} --require-complete-source
          tar -C "$RELOCATED" -cJf "${{ matrix.artifact }}" .

      - name: 打包、搬移并验证 AV2 包
        if: matrix.av2
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/package-av2"
          RELOCATED="$RUNNER_TEMP/relocated-av2"
          python3 scripts/ci/package-runtime.py --platform macos \
            --bin-dir "$HOME/ffmpeg-install/bin" --source-dir "$CI_BUILD_ROOT/ffmpeg-src" \
            --output "$STAGING" --license-dir "$HOME/ffmpeg-install/share" \
            --avm-prefix "$AVM_PREFIX" --dependency-source "$RUNNER_TEMP/avm" \
            --complete-source-dir "$RUNNER_TEMP/dependency-sources"
          mv "$STAGING" "$RELOCATED"
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH python3 scripts/ci/verify-runtime.py --platform macos \
            --directory "$RELOCATED" ${{ matrix.verify_args }} --avm --require-complete-source
          bash scripts/ci/verify-avm.sh "$RELOCATED/ffmpeg"
          tar -C "$RELOCATED" -cJf "${{ matrix.av2_artifact }}" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.av2
        with:
          name: ${{ matrix.av2_artifact }}
          path: ${{ matrix.av2_artifact }}
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # RELEASE — 验证后的原有 11 个包 + 4 个 AV2 工具整合包
  # ============================================================
  release:
    name: 创建 GitHub Release
    # Every package carries a verified complete corresponding-source inventory.
    needs:
      - metadata
      - linux
      - windows
      - macos-arm
    if: needs.metadata.outputs.should_release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.xz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          python3 - <<'PY'
          from pathlib import Path
          assets = list(Path('release-assets').iterdir())
          if len(assets) != 15:
              raise SystemExit(f'Expected all 15 release assets, found {len(assets)}')
          for asset in assets:
              size = asset.stat().st_size
              if not 0 < size < 2 * 1024**3:
                  raise SystemExit(f'Release asset must be nonempty and below 2 GiB: {asset} ({size} bytes)')
          PY
          ls -lh release-assets/

      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: FFmpeg ${{ needs.metadata.outputs.release_tag }}
          body: |
            ## 🎬 FFmpeg 多厂商构建

            每个压缩包都包含 **ffmpeg + ffprobe + ffplay**，并带厂商特定的硬件加速。

            ### 📦 Linux（x86_64）

            | 产物 | GPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-linux-nvidia.tar.xz` | NVIDIA | NVENC/CUDA | ✅ CUDA |
            | `ffmpeg-linux-intel-qsv.tar.xz` | Intel | QSV (oneVPL) + VAAPI | ✅ CPU |
            | `ffmpeg-linux-amd.tar.xz` | AMD | VAAPI | ✅ CPU |
            | `ffmpeg-linux-x86-all.tar.xz` | NVIDIA + Intel + AMD | NVENC/CUDA + QSV + VAAPI | ✅ CUDA |

            ### 📦 Linux（ARM64）

            | 产物 | GPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-linux-arm.tar.xz` | — | VAAPI / CPU | ✅ CPU |

            ### 📦 Windows（x86_64，MSVC）

            | 产物 | GPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-windows-nvidia.zip` | NVIDIA | NVENC/CUDA | ✅ CUDA |
            | `ffmpeg-windows-amd-amf.zip` | AMD | AMF | ✅ CPU |
            | `ffmpeg-windows-intel-qsv.zip` | Intel | QSV (oneVPL) | ✅ CPU |
            | `ffmpeg-windows-x86-all.zip` | NVIDIA + Intel + AMD | NVENC/CUDA + QSV + AMF | ✅ CUDA |

            ### 📦 Windows（ARM64，MSVC）

            | 产物 | CPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-windows-arm64.zip` | Snapdragon X | D3D11VA / DXVA2 / MF | ✅ CPU |

            ### 📦 macOS（ARM64）

            | 产物 | GPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-macos-arm.tar.xz` | Apple | VideoToolbox | ✅ CPU |

            ### AV2 工具整合版（保留上述原有构建）

            | 产物 | 硬件加速 | AV2 |
            |---|---|---|
            | `ffmpeg-linux-x86-all-av2.tar.xz` | NVENC/CUDA + QSV + VAAPI | avmenc / avmdec |
            | `ffmpeg-windows-x86-all-av2.zip` | NVENC/CUDA + QSV + AMF | avmenc / avmdec |
            | `ffmpeg-windows-arm64-av2.zip` | D3D11VA / DXVA2 / MF | avmenc / avmdec |
            | `ffmpeg-macos-arm-av2.tar.xz` | VideoToolbox | avmenc / avmdec |

            AV2 由 AVM 1.0.0 的独立工具提供，不是 FFmpeg 原生编解码器；原有 libaom AV1 保留。

            > 所有构建均包含： SDL2 (ffplay) + libx264 + libx265 + libvpx + libopus + libvorbis + libtheora + libaom + libwebp + libass + libfreetype + fontconfig + libzimg + libsoxr + libopenjpeg + libsnappy
            > 所有构建启用 libjxl / JPEG XL 与 libvmaf，并带 `--enable-nonfree`（FFmpeg 会标记为 nonfree and unredistributable）。
            > Linux 优先链接静态依赖；不可避免的非系统共享库随包分发。macOS 随包提供非系统 dylib，并重写加载路径及 ad-hoc 签名。
            > Windows 使用 MSVC /MT 与静态 vcpkg 依赖；硬件加速仍需要兼容的厂商驱动。
            > 每个包带 FFmpeg 许可证、实际构建源码/修改、配置及依赖版权信息，并嵌入自动收集和校验的对应版本依赖源码。
            > 全部平台的源码收集、完整性校验和运行验证成功后自动发布；任一失败均阻止发布。再分发仍须遵守各依赖许可证。
          files: release-assets/*
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
