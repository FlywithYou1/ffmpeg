name: FFmpeg 多厂商构建

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 0:00 = UTC 前一天 16:00
    - cron: '0 16 * * *'
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '.github/workflows/build-ffmpeg.yml'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 构建元数据（决定 Release 标签与类型）
  # ============================================================
  metadata:
    name: 构建元数据
    runs-on: ubuntu-26.04
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      should_release: ${{ steps.vars.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7

      - name: 确定 Release 参数
        id: vars
        run: |
          EVENT_NAME="${{ github.event_name }}"
          if [ "$EVENT_NAME" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            TAG="nightly-$(date -u +%Y-%m-%d-%H%M%S)"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="prerelease-$(date -u +%Y-%m-%d-%H%M%S)"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  # vcpkg baseline 自动更新在 windows job（本轮构建即用最新 ports）

  # ============================================================
  # LINUX — Matrix（NVIDIA / Intel QSV / AMD VAAPI / x86 整合 / ARM64）
  # ============================================================
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: nvidia
            name: Linux（NVIDIA NVENC/CUDA）
            runner: ubuntu-26.04
            extra_packages: libva-dev libvpl-dev libdrm-dev
            cuda: true
            vmaf_cuda: true
            configure_extra: --enable-libvmaf --enable-ffnvcodec --enable-cuda-nvcc --enable-cuvid --enable-nvenc
            verify_grep: "grep -E 'av1_nvenc|hevc_nvenc|h264_nvenc'"
            artifact: ffmpeg-linux-nvidia.tar.xz
          - id: intel-qsv
            name: Linux（Intel QSV）
            runner: ubuntu-26.04
            extra_packages: libva-dev libvpl-dev libdrm-dev
            cuda: false
            vmaf_cuda: false
            configure_extra: --enable-libvmaf --enable-libvpl --enable-vaapi
            verify_grep: "grep '_qsv' | head -10"
            artifact: ffmpeg-linux-intel-qsv.tar.xz
          - id: amd
            name: Linux（AMD VAAPI）
            runner: ubuntu-26.04
            extra_packages: libva-dev libdrm-dev
            cuda: false
            vmaf_cuda: false
            configure_extra: --enable-libvmaf --enable-vaapi
            verify_grep: "grep '_vaapi' | head -10"
            artifact: ffmpeg-linux-amd.tar.xz
          - id: x86-all
            name: "Linux x86 整合版（NVIDIA + Intel QSV + AMD VAAPI）"
            runner: ubuntu-26.04
            extra_packages: libva-dev libvpl-dev libdrm-dev
            cuda: true
            vmaf_cuda: true
            configure_extra: --enable-libvmaf --enable-ffnvcodec --enable-cuda-nvcc --enable-cuvid --enable-nvenc --enable-vaapi --enable-libvpl
            verify_grep: "grep -E 'av1_nvenc|hevc_nvenc|h264_nvenc|_qsv|_vaapi' | head -10"
            artifact: ffmpeg-linux-x86-all.tar.xz
          - id: arm
            name: Linux（ARM64 VAAPI）
            runner: ubuntu-26.04-arm
            extra_packages: libva-dev libdrm-dev
            cuda: false
            vmaf_cuda: false
            configure_extra: --enable-libvmaf --enable-vaapi
            verify_grep: "grep '_vaapi' | head -10"
            artifact: ffmpeg-linux-arm.tar.xz
    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential yasm nasm pkg-config meson ninja-build \
            cmake git wget curl ca-certificates gnupg python3 xxd texinfo \
            libmp3lame-dev libfdk-aac-dev libsdl2-dev \
            ${{ matrix.extra_packages }} \
            libx264-dev libx265-dev libvpx-dev libopus-dev libvorbis-dev \
            libtheora-dev libaom-dev libwebp-dev libass-dev libfreetype6-dev \
            libfontconfig1-dev libzimg-dev libsoxr-dev libopenjp2-7-dev \
            libsnappy-dev libvulkan-dev opencl-headers ocl-icd-opencl-dev glslc \
            libsvtav1enc-dev libdav1d-dev libkvazaar-dev libcrypto++-dev libopenh264-dev libxvidcore-dev \
            libtwolame-dev libspeex-dev libcodec2-dev libjxl-dev libopenmpt-dev libnuma-dev \
            liblcms2-dev libxxhash-dev libbs2b-dev libaribb24-dev libplacebo-dev glslang-dev spirv-tools librubberband-dev libvidstab-dev
            sudo apt-get upgrade -y -qq
            bash scripts/ci/linux-pc-fallbacks.sh /usr

      - name: 安装 CUDA 工具包
        if: matrix.cuda
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y cuda-toolkit-13-3
          sudo apt-get update -qq
          sudo apt-get upgrade -y -qq
          CUDA_VER_DIR=$(ls -d /usr/local/cuda-13.* 2>/dev/null | sort -V | tail -1)
          if [ -n "${CUDA_VER_DIR}" ]; then
            sudo ln -sf "${CUDA_VER_DIR}" /usr/local/cuda 2>/dev/null || true
            echo "CUDA linked: ${CUDA_VER_DIR}"
          else
            sudo ln -sf /usr/local/cuda-13.3 /usr/local/cuda 2>/dev/null || true
          fi

      - name: 检测 CUDA
        if: matrix.cuda
        run: |
          CUDA_BASE=""
          for d in /usr/local/cuda-* /usr/local/cuda; do
            if [ -d "$d/bin" ] && [ -x "$d/bin/nvcc" ]; then CUDA_BASE="$d"; break; fi
          done
          [ -z "${CUDA_BASE}" ] && { echo "::error::未找到 CUDA"; exit 1; }
          echo "CUDA_HOME=${CUDA_BASE}" >> "${GITHUB_ENV}"
          "${CUDA_BASE}/bin/nvcc" --version

      - name: 编译 nv-codec-headers
        if: matrix.cuda
        run: |
          cd /tmp && git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers
          cd nv-codec-headers
          make -j"$(nproc)" PREFIX=/usr/local
          sudo make PREFIX=/usr/local install

      - name: 编译 VMAF
        run: |
          P="${HOME}/ffmpeg-install"
          cd /tmp && git clone --depth 1 https://github.com/Netflix/vmaf.git
          cd vmaf/libvmaf && rm -rf build
          if [ "${{ matrix.vmaf_cuda }}" = "true" ]; then
            export CUDA_PATH="${CUDA_HOME}" CUDACXX="${CUDA_HOME}/bin/nvcc"
            export PATH="${CUDA_HOME}/bin:${PATH}"
            export C_INCLUDE_PATH="${CUDA_HOME}/include:${C_INCLUDE_PATH:-}"
            meson setup build --buildtype release --prefix="$P" --libdir=lib \
              -Denable_cuda=true -Dc_link_args="-lstdc++" -Dcpp_link_args="-lstdc++"
          else
            PKG_CONFIG_PATH="$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
            meson setup build --buildtype release --prefix="$P" --libdir=lib -Denable_cuda=false
          fi
          ninja -vC build && ninja -C build install
          echo "PKG_CONFIG_PATH=$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

      - name: 编译 FFmpeg
        run: |
          P="${HOME}/ffmpeg-install"
          bash scripts/ci/linux-pc-fallbacks.sh "$P"
          export PKG_CONFIG_PATH="${P}/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          if [ "${{ matrix.cuda }}" = "true" ]; then
            export PATH="${CUDA_HOME}/bin:${PATH}"
          fi
          cd /tmp && git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          cd ffmpeg-src
          ./configure --prefix="$P" --pkg-config-flags="--static" \
            --extra-cflags="-I$P/include" \
            --extra-ldflags="-L$P/lib -Wl,-rpath,$P/lib" \
            --extra-libs="-lpthread -lm -ldl" \
            --enable-gpl --enable-version3 --enable-nonfree --enable-lto \
            ${{ matrix.configure_extra }} --enable-opencl --enable-vulkan \
            --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-libtheora --enable-libaom --enable-libwebp --enable-libass --enable-libfreetype --enable-fontconfig --enable-libzimg --enable-libsoxr --enable-libopenjpeg --enable-libsnappy --enable-libsvtav1 --enable-libdav1d --enable-libkvazaar --enable-libopenh264 --enable-libxvid --enable-libtwolame --enable-libspeex --enable-libcodec2 --enable-libjxl --enable-libopenmpt --enable-libbs2b --enable-libaribb24 --enable-libplacebo --enable-librubberband --enable-libvidstab --enable-libmp3lame --enable-libfdk-aac --enable-sdl2 --enable-doc
          make -j"$(nproc)" && make install

      - name: 失败时导出 ffbuild/config.log
        if: failure()
        run: |
          echo "=== ffbuild/config.log ==="
          cat /tmp/ffmpeg-src/ffbuild/config.log 2>/dev/null || echo "(config.log not found)"

      - name: 裁剪与验证
        run: |
          export LD_LIBRARY_PATH="${HOME}/ffmpeg-install/lib:${LD_LIBRARY_PATH:-}"
          strip "${HOME}/ffmpeg-install/bin/ffmpeg" "${HOME}/ffmpeg-install/bin/ffprobe" "${HOME}/ffmpeg-install/bin/ffplay" 2>/dev/null || true
          "${HOME}/ffmpeg-install/bin/ffmpeg" -version 2>&1 | head -n5
          echo "--- HW Accel ---"
          "${HOME}/ffmpeg-install/bin/ffmpeg" -hide_banner -encoders 2>&1 | ${{ matrix.verify_grep }} || echo "（无）"
          echo "--- VMAF ---"
          "${HOME}/ffmpeg-install/bin/ffmpeg" -hide_banner -filters 2>&1 | grep -i vmaf || echo "（无）"

      - name: 打包
        run: |
          mkdir -p dist && cp "${HOME}/ffmpeg-install/bin/"{ffmpeg,ffprobe,ffplay} dist/
          [ -d "${HOME}/ffmpeg-install/share/doc/ffmpeg" ] && cp -r "${HOME}/ffmpeg-install/share/doc/ffmpeg" dist/doc || true
          cd dist && tar -cJf ../${{ matrix.artifact }} .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  # ============================================================
  # LINUX — NVIDIA（NVENC/CUDA + VMAF-CUDA）
  # ============================================================
  # ============================================================
  # WINDOWS — Matrix（NVIDIA / AMD AMF / Intel QSV / ARM64 / x86 整合）
  # ============================================================
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write    # 回写 vcpkg.json builtin-baseline
      packages: write    # NuGet readwrite via vcpkg binary cache
    env:
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_BASELINE_CHANGED: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: nvidia
            name: Windows（NVIDIA NVENC/CUDA）
            runner: windows-2025-vs2026
            msvc_arch: amd64
            triplet: x64-windows-static
            cuda: true
            amf: false
            vpl: false
            configure_extra: --enable-libvmaf --enable-libsvtav1 --enable-ffnvcodec --enable-cuda-nvcc --enable-cuvid --enable-nvenc
            artifact: ffmpeg-windows-nvidia.zip
          - id: amd-amf
            name: Windows（AMD AMF）
            runner: windows-2025-vs2026
            msvc_arch: amd64
            triplet: x64-windows-static
            cuda: false
            amf: true
            vpl: false
            configure_extra: --enable-libvmaf --enable-libsvtav1 --enable-amf
            artifact: ffmpeg-windows-amd-amf.zip
          - id: intel-qsv
            name: Windows（Intel QSV）
            runner: windows-2025-vs2026
            msvc_arch: amd64
            triplet: x64-windows-static
            cuda: false
            amf: false
            vpl: true
            configure_extra: --enable-libvmaf --enable-libsvtav1 --enable-libvpl
            artifact: ffmpeg-windows-intel-qsv.zip
          - id: arm64
            name: Windows ARM64（Snapdragon）
            runner: windows-11-vs2026-arm
            msvc_arch: amd64_arm64
            triplet: arm64-windows-static
            cuda: false
            amf: false
            vpl: false
            # 交叉编译必须 --arch=arm64，否则当成 x86（_tzcnt / x86asm LNK1112）
            configure_extra: --enable-libvmaf --enable-libsvtav1 --arch=arm64 --enable-neon
            artifact: ffmpeg-windows-arm64.zip
          - id: x86-all
            name: "Windows x86 整合版（NVIDIA + Intel QSV + AMD AMF）"
            runner: windows-2025-vs2026
            msvc_arch: amd64
            triplet: x64-windows-static
            cuda: true
            amf: true
            vpl: true
            configure_extra: --enable-libvmaf --enable-libsvtav1 --enable-ffnvcodec --enable-cuda-nvcc --enable-cuvid --enable-nvenc --enable-amf --enable-libvpl
            artifact: ffmpeg-windows-x86-all.zip
    steps:
      - name: 禁用 Git CRLF 自动转换
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - name: 配置 MSVC（VS 2026）
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}
          vsversion: "18.0"

      - name: 安装构建工具
        shell: pwsh
        run: |
          choco install -y --no-progress nasm make ninja strawberryperl
          pip install meson
          refreshenv
          $nasmDir = $null
          foreach ($d in @("${env:ProgramFiles}\NASM", "${env:ProgramFiles(x86)}\NASM", "C:\ProgramData\chocolatey\bin")) {
            if (Test-Path "$d\nasm.exe") { $nasmDir = $d; break }
          }
          if ($nasmDir) { echo "$nasmDir" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append; Write-Host "nasm: $nasmDir" }
          if (-not $nasmDir) { Write-Host "::warning::nasm.exe not found" }
          echo "C:\ProgramData\chocolatey\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $cleanPath = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Strawberry' }) -join ';'
          [Environment]::SetEnvironmentVariable('PATH', $cleanPath, 'Process')
          echo "PATH=$cleanPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clangDir = $null
          if (Test-Path $vsWhere) {
            $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath 2>$null | Select-Object -First 1
            if ($vsPath) {
              $candidate = Join-Path $vsPath "VC\Tools\Llvm\x64\bin"
              if (Test-Path "$candidate\clang.exe") { $clangDir = $candidate }
            }
          }
          $clangDirUnix = $clangDir -replace '\\','/'
          if ($clangDir) { Write-Host "VS Clang: $clangDir" }
          if ($clangDir) { echo "$clangDir" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append }
          if ($clangDirUnix) { echo "CLANG_BIN=$clangDirUnix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append }
          if (-not $clangDir) { Write-Host "::warning::VS Clang not found" }

      - name: 准备 vcpkg（对齐 baseline / 自动更新）
        id: vcpkg-prep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'vcpkg.json'
          $json = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $current = [string]$json.'builtin-baseline'
          if (-not $current) { throw 'vcpkg.json missing builtin-baseline' }

          $latest = (git ls-remote https://github.com/microsoft/vcpkg.git HEAD).Split("`t")[0].Trim()
          if (-not $latest) { throw 'failed to resolve microsoft/vcpkg HEAD' }
          $target = $latest
          if ($current -ne $latest) {
            Write-Host "vcpkg baseline: $current -> $latest"
            $raw = Get-Content -LiteralPath $manifest -Raw
            $updated = [regex]::Replace($raw, '("builtin-baseline"\s*:\s*")[^"]*(")', "`${1}$latest`${2}")
            [System.IO.File]::WriteAllText($manifest, $updated)
            echo "VCPKG_BASELINE_CHANGED=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            echo "baseline_changed=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "vcpkg baseline already latest: $current"
            echo "VCPKG_BASELINE_CHANGED=false" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            echo "baseline_changed=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          echo "VCPKG_BASELINE=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $v = if (Test-Path 'C:\vcpkg') { 'C:\vcpkg' } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          if (-not (Test-Path $v)) {
            git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $v
          }
          Push-Location $v
          try {
            git remote set-url origin https://github.com/microsoft/vcpkg.git 2>$null
            $head = (git rev-parse HEAD 2>$null)
            if ($head -ne $target) {
              Write-Host "Checking out vcpkg @$target (was $head)"
              git fetch --depth 1 origin $target
              git checkout --force FETCH_HEAD
              git reset --hard FETCH_HEAD
            } else {
              Write-Host "vcpkg tree already at $target"
            }
          } finally { Pop-Location }

          $env:VCPKG_ROOT = $v
          echo "VCPKG_ROOT=$v" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$v" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

          $needBootstrap = -not (Test-Path "$v\vcpkg.exe")
          $marker = Join-Path $v '.ffmpeg-bootstrapped-sha'
          $prev = if (Test-Path $marker) { (Get-Content -LiteralPath $marker -Raw).Trim() } else { '' }
          if ($prev -ne $target) { $needBootstrap = $true }
          if ($needBootstrap) {
            $maxRetries = 3
            for ($i = 1; $i -le $maxRetries; $i++) {
              Write-Host "Bootstrapping vcpkg (attempt $i/$maxRetries)..."
              & "$v\bootstrap-vcpkg.bat" -disableMetrics
              if ($LASTEXITCODE -eq 0) {
                Set-Content -LiteralPath $marker -Value $target -NoNewline
                break
              }
              if ($i -eq $maxRetries) { throw "vcpkg bootstrap failed after $maxRetries attempts" }
              Start-Sleep -Seconds 10
            }
          } else {
            Write-Host "Skip bootstrap (vcpkg.exe matches $target)"
          }

      - name: 回写 vcpkg baseline
        if: >
          matrix.id == 'nvidia' &&
          steps.vcpkg-prep.outputs.baseline_changed == 'true' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vcpkg.json
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -eq 0) {
            Write-Host "No baseline change to commit"
            exit 0
          }
          $sha = $env:VCPKG_BASELINE
          git commit -m "chore(vcpkg): bump baseline to $sha"
          git push origin "HEAD:${{ github.ref_name }}"
          Write-Host "Pushed vcpkg baseline $sha"

      - name: 配置 vcpkg NuGet 缓存
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          $v = $env:VCPKG_ROOT
          if (-not $v) { $v = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } else { "$env:VCPKG_INSTALLATION_ROOT" } }
          if (-not $env:GH_PACKAGES_TOKEN) { Write-Host "::warning::GH_PACKAGES_TOKEN not set, building from source"; exit 0 }
          $vcpkgExe = "$v\vcpkg.exe"
          $nuget = & $vcpkgExe fetch nuget | Where-Object { $_ } | Select-Object -Last 1
          if (-not $nuget) { throw "Failed to fetch vcpkg nuget" }
          Write-Host "nuget: $nuget"
          cmd /c "`"$nuget`" sources Remove -Name GitHubPackages 2>nul || exit /b 0"
          & $nuget sources add -Source "$env:FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "${{ github.repository_owner }}" -Password "$env:GH_PACKAGES_TOKEN"
          & $nuget setapikey "$env:GH_PACKAGES_TOKEN" -Source "$env:FEED_URL"
          echo "VCPKG_BINARY_SOURCES=clear;nuget,$env:FEED_URL,readwrite" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        continue-on-error: true

      - name: 安装 vcpkg 依赖
        shell: pwsh
        run: |
          $v = $env:VCPKG_ROOT
          if (-not $v) { $v = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } else { "$env:VCPKG_INSTALLATION_ROOT" } }
          $env:VCPKG_ROOT = $v
          if (-not $env:VCPKG_BINARY_SOURCES) {
            $env:VCPKG_BINARY_SOURCES = "clear;nuget,$env:FEED_URL,readwrite"
          }
          foreach ($dir in @("$v\archives", "$v\packages", "$v\installed", "$env:GITHUB_WORKSPACE\vcpkg_installed")) {
            if (Test-Path $dir) {
              $libCount = (Get-ChildItem $dir -Recurse -Filter '*.lib' -ErrorAction SilentlyContinue).Count
              Write-Output "Cache dir $dir : $libCount .lib files"
              if ($libCount -eq 0) { Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue; Write-Output "  -> purged (empty)" }
            }
          }
          $env:Path = "$v;" + $env:Path
          $inst = "$env:GITHUB_WORKSPACE\vcpkg_installed\${{ matrix.triplet }}"
          $instUnix = $inst -replace '\\', '/'
          echo "VCPKG_INSTALLED=$instUnix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "vcpkg install @ $($env:VCPKG_BASELINE) triplet=${{ matrix.triplet }}"
          for ($i = 1; $i -le 3; $i++) {
            Write-Output "Installing vcpkg packages (attempt $i/3)..."
            & "$v\vcpkg.exe" install --triplet ${{ matrix.triplet }} --x-manifest-root=$env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { throw "vcpkg install failed after 3 attempts" }
            Write-Output "Install failed, retrying in 10s..."
            Start-Sleep -Seconds 10
          }

          if ('${{ matrix.vpl }}' -eq 'true') {
            pwsh scripts/ci/write-fallback-pc.ps1 -InstallRoot "$inst" -HasVpl
          } else {
            pwsh scripts/ci/write-fallback-pc.ps1 -InstallRoot "$inst"
          }

      - name: 从源码编译 zimg
        shell: pwsh
        run: |
          $zimgRoot = "$env:TEMP\zimg-src"
          Remove-Item -Recurse -Force $zimgRoot -ErrorAction SilentlyContinue
          git clone --depth 1 --recurse-submodules https://github.com/sekrit-twc/zimg.git $zimgRoot
          cd $zimgRoot
          $ver = (Select-String -Path "$zimgRoot\configure.ac" -Pattern 'AC_INIT\(\[zimg\], \[([^\]]+)\]').Matches.Groups[1].Value
          if (-not $ver) { $ver = '3.0.6' }
          $plat = if ($env:VSCMD_ARG_TGT_ARCH -eq 'arm64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          $props = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<Project ToolsVersion="4.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">',
            '  <PropertyGroup>',
            '    <WholeProgramOptimization>false</WholeProgramOptimization>',
            '  </PropertyGroup>',
            '  <ItemDefinitionGroup>',
            '    <ClCompile>',
            '      <RuntimeLibrary>MultiThreaded</RuntimeLibrary>',
            '      <WholeProgramOptimization>false</WholeProgramOptimization>',
            '    </ClCompile>',
            '  </ItemDefinitionGroup>',
            '</Project>'
          )
          [System.IO.File]::WriteAllLines("$zimgRoot\_msvc\Directory.Build.props", $props, [System.Text.UTF8Encoding]::new($false))
          msbuild "$zimgRoot\_msvc\zimg.sln" /p:Configuration=Release /p:Platform=$plat /t:zimg /p:PlatformToolset=v145 /p:WindowsTargetPlatformVersion=10.0 /p:WholeProgramOptimization=false /m
          $lib = Get-ChildItem "$zimgRoot\_msvc" -Recurse -Filter "z.lib" | Select-Object -First 1
          if (-not $lib) { throw "z.lib not found after building zimg" }
          $prefix = $env:VCPKG_INSTALLED
          New-Item -ItemType Directory -Path "$prefix\include", "$prefix\lib", "$prefix\lib\pkgconfig" -Force | Out-Null
          Copy-Item "$zimgRoot\src\zimg\api\zimg.h" "$prefix\include\zimg.h" -Force
          if (Test-Path "$zimgRoot\src\zimg\api\zimg++.hpp") {
            Copy-Item "$zimgRoot\src\zimg\api\zimg++.hpp" "$prefix\include\zimg++.hpp" -Force
          } elseif (Test-Path "$zimgRoot\src\zimg\api\zimg++.h") {
            Copy-Item "$zimgRoot\src\zimg\api\zimg++.h" "$prefix\include\zimg++.h" -Force
          }
          Copy-Item $lib.FullName "$prefix\lib\z.lib" -Force
          Copy-Item $lib.FullName "$prefix\lib\zimg.lib" -Force
          $pcMixed = ($prefix -replace '\\','/')
          $pc = @(
            "prefix=$pcMixed",
            'exec_prefix=${prefix}',
            'libdir=${prefix}/lib',
            'includedir=${prefix}/include',
            '',
            'Name: zimg',
            'Description: z.lib image processing library',
            "Version: $ver",
            'Libs: ${libdir}/zimg.lib',
            'Cflags: -I${includedir}'
          )
          [System.IO.File]::WriteAllLines("$prefix\lib\pkgconfig\zimg.pc", $pc, [System.Text.UTF8Encoding]::new($false))
          Write-Host "zimg $ver built for $plat"

      - name: 检查 vcpkg pkg-config
        shell: bash
        run: |
          __clean_path() { local __new="" __e; IFS=':' read -ra __entries <<< "$PATH"; for __e in "${__entries[@]}"; do case "$__e" in *[Ss]trawberry*) ;; *) __new="${__new:+${__new}:}${__e}" ;; esac; done; export PATH="$__new"; }
          __clean_path
          # 优先用 PKG_CONFIG_DIR（vcpkg manifest 模式），回退到全局 PKG_CONFIG
          if [ -z "${PKG_CONFIG:-}" ] && [ -n "${PKG_CONFIG_DIR:-}" ]; then
            PKG_CONFIG="${PKG_CONFIG_DIR}/pkg-config.exe"
            [ ! -f "$PKG_CONFIG" ] && PKG_CONFIG="${PKG_CONFIG_DIR}/pkgconf.exe"
          fi
          [ -z "${PKG_CONFIG:-}" ] && PKG_CONFIG="$(which pkg-config 2>/dev/null || echo)"
          echo "PKG_CONFIG=${PKG_CONFIG:-未设置}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          echo "--- .pc files ---"
          find "${VCPKG_INSTALLED}/lib/pkgconfig" -name '*.pc' -print0 2>/dev/null | xargs -0 -I{} sh -c 'echo "== {} =="; cat "{}"' || true
          echo "--- pkg-config checks ---"
          if [ -n "${PKG_CONFIG:-}" ] && [ -x "$PKG_CONFIG" ]; then
            $PKG_CONFIG --exists libmp3lame && echo "libmp3lame OK: version=$($PKG_CONFIG --modversion libmp3lame) libs=$($PKG_CONFIG --libs libmp3lame) cflags=$($PKG_CONFIG --cflags libmp3lame)" || echo "未找到 libmp3lame"
            $PKG_CONFIG --exists libfdk-aac && echo "libfdk-aac OK: version=$($PKG_CONFIG --modversion libfdk-aac) libs=$($PKG_CONFIG --libs libfdk-aac) cflags=$($PKG_CONFIG --cflags libfdk-aac)" || echo "未找到 libfdk-aac"
            $PKG_CONFIG --exists sdl2 && echo "sdl2 OK: version=$($PKG_CONFIG --modversion sdl2) libs=$($PKG_CONFIG --libs sdl2) cflags=$($PKG_CONFIG --cflags sdl2)" || echo "未找到 sdl2"
            $PKG_CONFIG --exists vpl && echo "vpl OK: version=$($PKG_CONFIG --modversion vpl) libs=$($PKG_CONFIG --libs vpl) cflags=$($PKG_CONFIG --cflags vpl)" || echo "未找到 vpl"
            $PKG_CONFIG --exists zimg && echo "zimg OK: version=$($PKG_CONFIG --modversion zimg) libs=$($PKG_CONFIG --libs zimg) cflags=$($PKG_CONFIG --cflags zimg)" || echo "未找到 zimg"
            $PKG_CONFIG --exists aom && echo "aom OK: version=$($PKG_CONFIG --modversion aom) libs=$($PKG_CONFIG --libs aom) cflags=$($PKG_CONFIG --cflags aom)" || echo "未找到 aom"
          else
            echo "pkg-config 未找到，跳过检查"
          fi

      - name: 安装 CUDA 工具包
        if: matrix.cuda
        shell: pwsh
        run: winget install --id Nvidia.CUDA -e --accept-source-agreements --accept-package-agreements --silent

      - name: 检测 CUDA
        if: matrix.cuda
        shell: bash
        run: |
          CUDA_BASE=""
          for base in "/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA" "/c/Program Files/NVIDIA/CUDA"; do
            for d in "$base"/v* "$base"/v*.*; do
              if [ -d "$d/bin" ] && [ -x "$d/bin/nvcc.exe" ]; then CUDA_BASE="$d"; break 2; fi
            done
          done
          [ -z "${CUDA_BASE}" ] && NVCCBIN="$(dirname "$(which nvcc 2>/dev/null || true)" 2>/dev/null || true)" && \
            [ -n "${NVCCBIN}" ] && CUDA_BASE="$(dirname "${NVCCBIN}")"
          [ -z "${CUDA_BASE}" ] && { echo "::error::未找到 CUDA"; exit 1; }
          echo "CUDA_HOME=${CUDA_BASE}" >> "${GITHUB_ENV}"
          "${CUDA_BASE}/bin/nvcc.exe" --version

      - name: 创建 CUDA junction
        if: matrix.cuda
        shell: pwsh
        run: |
          $cuda = $env:CUDA_HOME
          if (-not $cuda) { Write-Error "CUDA_HOME is not set"; exit 1 }
          if ($cuda -match '^/([a-zA-Z])/(.*)$') {
            $cuda = "$($matches[1].ToUpper()):\$($matches[2])" -replace '/', '\\'
          } elseif ($cuda -match '^[a-zA-Z]:') {
            $cuda = $cuda -replace '/', '\\'
          }
          $link = "C:\cuda"
          if (Test-Path $link) { Remove-Item $link -Recurse -Force }
          cmd /c mklink /J "$link" "$cuda" | Out-Null
          if (-not (Test-Path "$link\bin\nvcc.exe")) { Write-Error "Junction failed"; exit 1 }
          echo "CUDA_HOME_MIXED=C:/cuda" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CUDA junction: $link -> $cuda"

      - name: 编译 nv-codec-headers
        if: matrix.cuda
        shell: bash
        run: |
          P="${HOME}/ffmpeg-install"
          P_MIXED="$(cygpath -m "$P" 2>/dev/null || echo "$P")"
          cd /tmp && git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers
          cd nv-codec-headers
          make -j"$(nproc)" PREFIX="$P" && make PREFIX="$P" install
          echo "PKG_CONFIG_PATH=$P_MIXED/lib/pkgconfig;${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

      - name: 编译 VMAF
        shell: bash
        run: |
          __clean_path() { local __new="" __e; IFS=':' read -ra __entries <<< "$PATH"; for __e in "${__entries[@]}"; do case "$__e" in *[Ss]trawberry*) ;; *) __new="${__new:+${__new}:}${__e}" ;; esac; done; export PATH="$__new"; }
          __clean_path
          set -e; P="${HOME}/ffmpeg-install"
          P_MIXED="$(cygpath -m "$P" 2>/dev/null || echo "$P")"
          cd /tmp && git clone --depth 1 https://github.com/Netflix/vmaf.git
          cd vmaf/libvmaf && rm -rf build
          sed -i 's/^#ifdef _MSC_VER$/#if defined(_MSC_VER) \&\& !defined(__clang__)/' src/feature/integer_vif.h
          # MSVC does not allow pointer arithmetic on void*; integer_vif.c init() has data+=N
          python3 << 'PYEOF1'
          import pathlib, re
          p = pathlib.Path("src/feature/integer_vif.c")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"data \+= (.+?);", r"data = (void *)((unsigned char *)data + \1);", s)
          p.write_text(s, encoding="utf-8")
          PYEOF1
          # MSVC does not support C99 VLAs; fix VLAs in libvmaf.c, predict.c, read_json_model.c, tools/vmaf.c, test/test_feature_extractor.c
          python3 << 'PYEOF2'
          import pathlib
          p = pathlib.Path("src/libvmaf.c")
          s = p.read_text(encoding="utf-8")
          s = s.replace("char name[name_sz];", "char name[256];")
          p.write_text(s, encoding="utf-8")
          p = pathlib.Path("src/predict.c")
          s = p.read_text(encoding="utf-8")
          s = s.replace("double scores[model_collection->cnt];", "double *scores = malloc(model_collection->cnt * sizeof(double));")
          s = s.replace("char name[name_sz];", "char name[256];")
          p.write_text(s, encoding="utf-8")
          p = pathlib.Path("src/read_json_model.c")
          s = p.read_text(encoding="utf-8")
          s = s.replace("char cfg_name[cfg_name_sz];", "char cfg_name[256];")
          s = s.replace("char generated_key[generated_key_sz];", "char generated_key[5];")
          p.write_text(s, encoding="utf-8")
          p = pathlib.Path("tools/vmaf.c")
          s = p.read_text(encoding="utf-8")
          s = s.replace("const char *model_collection_label[c.model_cnt];", "const char *model_collection_label[128];")
          p.write_text(s, encoding="utf-8")
          p = pathlib.Path("test/test_feature_extractor.c")
          s = p.read_text(encoding="utf-8")
          s = s.replace("VmafFeatureExtractorContext *fex_ctx[n_threads];", "VmafFeatureExtractorContext *fex_ctx[128];")
          p.write_text(s, encoding="utf-8")
          PYEOF2
          # Fix ARM64 MSVC missing intrinsics: __builtin_clz / __lzcnt / __lzcnt64 -> _CountLeadingZeros
          # Only ARM64 MSVC cl.exe needs this; x64 Clang has __builtin_clz natively
          # TGT_ARCH is set later in this block; use VSCMD_ARG_TGT_ARCH (set by msvc-dev-cmd) instead
          if [ "${VSCMD_ARG_TGT_ARCH:-}" = "arm64" ]; then
          python3 << 'PYEOF3'
          import pathlib
          p = pathlib.Path("src/feature/integer_vif.h")
          s = p.read_text(encoding="utf-8")
          s = s.replace("__lzcnt(", "_CountLeadingZeros(")
          s = s.replace("__lzcnt64(", "_CountLeadingZeros64(")
          if "#include <intrin.h>" not in s:
              s = "#include <intrin.h>\n" + s
          p.write_text(s, encoding="utf-8")
          p = pathlib.Path("src/feature/integer_adm.c")
          s = p.read_text(encoding="utf-8")
          s = s.replace("__builtin_clz(", "_CountLeadingZeros(")
          if "#include <intrin.h>" not in s:
              s = s.replace("#include <stddef.h>", "#include <stddef.h>\n#include <intrin.h>", 1)
              if "#include <intrin.h>" not in s:
                  s = "#include <intrin.h>\n" + s
          p.write_text(s, encoding="utf-8")
          PYEOF3
          fi
          sed -i '1i typedef unsigned short mode_t;' src/feature/mkdirp.h
          python3 << 'PYEOF4'
          import pathlib
          for path in ("src/log.c", "src/feature/cuda/integer_adm_cuda.c"):
              p = pathlib.Path(path)
              if p.exists():
                  s = p.read_text(encoding="utf-8")
                  s = s.replace("#ifdef _MSC_VER\n", "#if defined(_MSC_VER) && !defined(__clang__)\n")
                  p.write_text(s, encoding="utf-8")
          PYEOF4
          if [ "${{ matrix.cuda }}" = "true" ]; then
          python3 << 'PYEOF5'
          import pathlib, re
          p = pathlib.Path("src/feature/integer_adm.h")
          if p.exists():
              s = p.read_text(encoding="utf-8")
              # Strip ALL C99 designated initializers (nvcc doesn't support .field = syntax)
              s = re.sub(r'\.\w+\s*=\s*', '', s)
              p.write_text(s, encoding="utf-8")
          PYEOF5
            export CUDA_HOME="/c/cuda"
            export CUDA_PATH="/c/cuda"
            export CUDACXX="/c/cuda/bin/nvcc"
            export PATH="/c/cuda/bin:${PATH}"
            CL="/c/cuda/lib/x64"; [ ! -d "$CL" ] && CL="/c/cuda/lib"
          fi
          CLDIR=$(dirname "$(which cl.exe 2>/dev/null)" 2>/dev/null || true)
          [ -n "$CLDIR" ] && export PATH="${CLDIR}:${PATH}"
          export PKG_CONFIG_PATH="$P_MIXED/lib/pkgconfig;${PKG_CONFIG_PATH:-}"
          # VMAF 的 MSVC stdatomic.h 依赖 common/attributes.h（来自 dav1d），但 VMAF 没打包它
          mkdir -p src/compat/msvc/common && echo $'#ifndef VMAF_MSVC_ATTRIBUTES_H\n#define VMAF_MSVC_ATTRIBUTES_H\n#define ALIGN(n) __declspec(align(n))\n#define offsetof(s,m) ((size_t)&(((s*)0)->m))\n#endif' > src/compat/msvc/common/attributes.h
          # PThreads4W 真实 pthread.h 依赖 _ptw32.h 等内部文件，无法单独使用 — 直接用 Windows SRWLOCK shim
          # mkdirp.c 引用 POSIX unistd.h，Windows 没有 — 同时生成 shim
          # unistd 假头仅给 VMAF。勿 #define mkdir：VMAF mkdirp.c 是单参，FFmpeg 是双参；编 FFmpeg 前会 rm 本文件
          mkdir -p "$P_MIXED/include" && echo $'#ifndef UNISTD_SHIM_H\n#define UNISTD_SHIM_H\ntypedef unsigned short mode_t;\n#include <io.h>\n#include <direct.h>\n#include <sys/stat.h>\n#include <stdlib.h>\n#include <windows.h>\n#ifndef isatty\n#define isatty _isatty\n#endif\n#ifndef fileno\n#define fileno _fileno\n#endif\n/* mkdir：交给 direct.h 的单参声明，供 VMAF mkdirp.c */\nstatic __inline unsigned int sleep(unsigned int sec){ Sleep(sec * 1000u); return 0; }\nstatic __inline void usleep(unsigned int usec){ Sleep((usec + 999u) / 1000u); }\n#endif' > "$P_MIXED/include/unistd.h"
          mkdir -p "$P_MIXED/include" && echo $'#ifndef PTHREAD_SHIM_H\n#define PTHREAD_SHIM_H\n#include <windows.h>\n#include <stdint.h>\n#ifdef __cplusplus\nextern "C" {\n#endif\ntypedef struct { SRWLOCK lock; int init; } pthread_mutex_t;\ntypedef struct { CONDITION_VARIABLE cv; int init; } pthread_cond_t;\ntypedef HANDLE pthread_t;\ntypedef struct { int init; int pshared; void *ptr; } pthread_mutexattr_t;\ntypedef struct { int init; int pshared; } pthread_condattr_t;\n#define PTHREAD_MUTEX_INITIALIZER { {0},0 }\n#define PTHREAD_COND_INITIALIZER   { {0},0 }\nstatic inline int pthread_mutex_init(pthread_mutex_t*m,const pthread_mutexattr_t*a){(void)a;InitializeSRWLock(&m->lock);m->init=1;return 0;}\nstatic inline int pthread_mutex_destroy(pthread_mutex_t*m){(void)m;m->init=0;return 0;}\nstatic inline int pthread_mutex_lock(pthread_mutex_t*m){AcquireSRWLockExclusive(&m->lock);return 0;}\nstatic inline int pthread_mutex_unlock(pthread_mutex_t*m){ReleaseSRWLockExclusive(&m->lock);return 0;}\nstatic inline int pthread_cond_init(pthread_cond_t*c,const pthread_condattr_t*a){(void)a;InitializeConditionVariable(&c->cv);c->init=1;return 0;}\nstatic inline int pthread_cond_destroy(pthread_cond_t*c){(void)c;c->init=0;return 0;}\nstatic inline int pthread_cond_wait(pthread_cond_t*c,pthread_mutex_t*m){return SleepConditionVariableSRW(&c->cv,&m->lock,INFINITE,0)?0:-1;}\nstatic inline int pthread_cond_signal(pthread_cond_t*c){WakeConditionVariable(&c->cv);return 0;}\nstatic inline int pthread_cond_broadcast(pthread_cond_t*c){WakeAllConditionVariable(&c->cv);return 0;}\nstatic inline int pthread_create(pthread_t*t,const void*a,void*(*f)(void*),void*arg){(void)a;*t=CreateThread(NULL,0,(LPTHREAD_START_ROUTINE)f,arg,0,NULL);return*t?0:-1;}\nstatic inline int pthread_join(pthread_t t,void**ret){WaitForSingleObject(t,INFINITE);if(ret)GetExitCodeThread(t,(LPDWORD)ret);CloseHandle(t);return 0;}\nstatic inline void pthread_exit(void*ret){ExitThread((DWORD)(uintptr_t)ret);}\nstatic inline int pthread_detach(pthread_t t){(void)t;return 0;}\n#ifdef __cplusplus\n}\n#endif\n#endif' > "$P_MIXED/include/pthread.h"
          # 如果 GITHUB_ENV 未传递 VCPKG_INSTALLED，直接用 find 探测
          if [ -z "${VCPKG_INSTALLED:-}" ]; then
            for vdir in "/c/vcpkg/installed/x64-windows-static" "/c/vcpkg/installed/arm64-windows-static"; do
              [ -d "$vdir" ] && { VCPKG_INSTALLED="$(echo "$vdir" | sed 's|^/c/|C:/|;s|^/d/|D:/|')"; break; }
            done
          fi
          # Clang-cl 和 MSVC 分别通过不同变量找头文件
          VCPKG_INC="${VCPKG_INSTALLED:+${VCPKG_INSTALLED}/include;}"
          export INCLUDE="${VCPKG_INC}${P_MIXED}/include;${INCLUDE:-}"
          if [ "${{ matrix.cuda }}" = "true" ]; then
          P_MIXED="$P_MIXED" VCPKG_INSTALLED="$VCPKG_INSTALLED" python3 << 'PYEOF6'
          import pathlib, os
          p_mixed = os.environ['P_MIXED']
          vcpkg_installed = os.environ.get('VCPKG_INSTALLED', '')
          mb = pathlib.Path('src/meson.build')
          s = mb.read_text(encoding='utf-8')
          s = s.replace(
              "'-I', '../src/' + cuda_dir,",
              f"'-I', '../src/' + cuda_dir,\n"
              f"'-I', '{p_mixed}/include',\n"
              f"'-I', '{vcpkg_installed}/include',")
          mb.write_text(s, encoding='utf-8')
          PYEOF6
            export INCLUDE="${INCLUDE};${CUDA_HOME}/include"
          fi
          # MSVC 不兼容 VMAF 的 GCC 风格 x86 汇编（-mavx / __builtin_clz / __m256 cast）
          # 有 Clang 时用 Clang 编译 VMAF（兼容 GCC 风格 SIMD），否则禁用 ASM
          TGT_ARCH="${VSCMD_ARG_TGT_ARCH:-}"
          if [ "$TGT_ARCH" = "arm64" ] || [ "$TGT_ARCH" = "arm" ]; then
            # ARM64：不覆盖 CC/CXX（x64 Clang 与 arm64 MSVC 库架构冲突）
            # VMAF 的 ARM64 NEON 是 C intrinsics（arm_neon.h），MSVC cl.exe 可直接编译
            # 不需要 NASM（NASM 是 x86-only，ARM64 分支不使用它）
            VMAF_ENABLE_ASM=true
          elif [ -n "${CLANG_BIN:-}" ] && [ -f "${CLANG_BIN}/clang.exe" ] && command -v nasm >/dev/null 2>&1; then
            export CC="${CLANG_BIN}/clang.exe"
            export CXX="${CLANG_BIN}/clang.exe"
            VMAF_ENABLE_ASM=true
          else
            VMAF_ENABLE_ASM=false
            echo "::warning::禁用 VMAF 汇编优化（MSVC 不兼容 GCC 风格 SIMD）"
          fi
          # Clang（非 clang-cl 模式）不读取 INCLUDE 环境变量，必须通过 -Dc_args 传入头文件路径
          # pthread.h 已生成在 $P_MIXED/include 下（在 -I 路径中），VMAF 编译时能找到
          VMAF_C_ARGS="-D_USE_MATH_DEFINES -D_CRT_SECURE_NO_WARNINGS"
          # pthread shim MUST come before vcpkg include (vcpkg has its own pthread.h that needs pthreads.lib)
          [ -n "${VCPKG_INSTALLED:-}" ] && VMAF_C_ARGS="-I${P_MIXED}/include -I${VCPKG_INSTALLED}/include ${VMAF_C_ARGS}"
          # MSVC cl.exe 需要 /experimental:c11atomics 启用 C11 <stdatomic.h>；Clang 不认识此标志
          if [ "${CC}" != "${CLANG_BIN}/clang.exe" ]; then
            VMAF_C_ARGS="${VMAF_C_ARGS} /experimental:c11atomics"
          fi
          VMAF_CPP_ARGS="${VMAF_C_ARGS} -std=c++14"
          VMAF_MESON_ARGS=("-Dc_args=${VMAF_C_ARGS}" "-Dcpp_args=${VMAF_CPP_ARGS}")
          echo "--- VMAF meson ---"
          echo "VCPKG_INSTALLED=${VCPKG_INSTALLED:-未设置}  VMAF_MESON_ARGS=${VMAF_MESON_ARGS[*]}"
          echo "CC=${CC:-cl.exe 默认}  VMAF_ENABLE_ASM=${VMAF_ENABLE_ASM}"
          echo "INCLUDE=${INCLUDE:-}"
          echo "------------------"
          # VMAF CLI (tools) 需要 getopt.h，Windows 没有 — 生成桩
          mkdir -p "$P_MIXED/include" && echo $'#ifndef GETOPT_SHIM_H\n#define GETOPT_SHIM_H\n#ifdef __cplusplus\nextern "C" {\n#endif\nstruct option { const char *name; int has_arg; int *flag; int val; };\n#define no_argument 0\n#define required_argument 1\n#define optional_argument 2\nstatic char *optarg = 0;\nstatic int optind = 1;\nstatic inline int getopt_long(int argc, char * const argv[], const char *optstring, const struct option *longopts, int *longindex){(void)argc;(void)argv;(void)optstring;(void)longopts;(void)longindex;return -1;}\n#ifdef __cplusplus\n}\n#endif\n#endif' > "$P_MIXED/include/getopt.h"
          PKG_CONFIG_PATH="$P_MIXED/lib/pkgconfig;${PKG_CONFIG_PATH:-}" \
            meson setup build --buildtype release --prefix="$P" \
              -Denable_cuda=${{ matrix.cuda }} -Denable_asm=$VMAF_ENABLE_ASM \
              -Denable_tests=false -Db_vscrt=mt -Ddefault_library=static "${VMAF_MESON_ARGS[@]}"
          # Only build libvmaf.a static library (FFmpeg only needs the lib, not the vmaf CLI tool).
          # The CLI tool depends on pthread_create etc. which our inline shim can't satisfy at link time.
          ninja -vC build src/libvmaf.a 2>&1 | tee /tmp/ninja-vmaf.log || {
            echo "::error::ninja 编译 VMAF 失败，详见下方 /tmp/ninja-vmaf.log"
            exit 1
          }
          mkdir -p "$P/lib" "$P/lib/pkgconfig" "$P/include/libvmaf"
          vmaf_static_lib=""
          for cand in build/src/libvmaf.a build/src/vmaf.lib build/src/libvmaf.lib; do
            [ -f "$cand" ] && { vmaf_static_lib="$cand"; break; }
          done
          [ -z "$vmaf_static_lib" ] && { echo "::error::在 build/src 下未找到 VMAF 静态库"; ls -la build/src; exit 1; }
          cp "$vmaf_static_lib" "$P/lib/vmaf.lib"
          # VMAF internally calls pthread_*; our shim header uses static inline
          # which MSVC may not inline, leaving unresolved externals at link time.
          # Build a small pthread_shim.lib with non-inline wrappers for linking.
          cat > "$P/lib/pthread_shim.c" << 'PTSHIM_EOF'
          #include <windows.h>
          #include <stdint.h>
          typedef struct { SRWLOCK lock; int init; } pthread_mutex_t;
          typedef struct { CONDITION_VARIABLE cv; int init; } pthread_cond_t;
          typedef HANDLE pthread_t;
          typedef struct { int init; int pshared; void *ptr; } pthread_mutexattr_t;
          typedef struct { int init; int pshared; } pthread_condattr_t;
          int pthread_mutex_init(pthread_mutex_t *m, const pthread_mutexattr_t *a) { (void)a; InitializeSRWLock(&m->lock); m->init=1; return 0; }
          int pthread_mutex_destroy(pthread_mutex_t *m) { (void)m; m->init=0; return 0; }
          int pthread_mutex_lock(pthread_mutex_t *m) { AcquireSRWLockExclusive(&m->lock); return 0; }
          int pthread_mutex_unlock(pthread_mutex_t *m) { ReleaseSRWLockExclusive(&m->lock); return 0; }
          int pthread_cond_init(pthread_cond_t *c, const pthread_condattr_t *a) { (void)a; InitializeConditionVariable(&c->cv); c->init=1; return 0; }
          int pthread_cond_destroy(pthread_cond_t *c) { (void)c; c->init=0; return 0; }
          int pthread_cond_wait(pthread_cond_t *c, pthread_mutex_t *m) { return SleepConditionVariableSRW(&c->cv, &m->lock, INFINITE, 0) ? 0 : -1; }
          int pthread_cond_signal(pthread_cond_t *c) { WakeConditionVariable(&c->cv); return 0; }
          int pthread_cond_broadcast(pthread_cond_t *c) { WakeAllConditionVariable(&c->cv); return 0; }
          int pthread_create(pthread_t *t, const void *a, void *(*f)(void *), void *arg) { (void)a; *t = CreateThread(NULL, 0, (LPTHREAD_START_ROUTINE)f, arg, 0, NULL); return *t ? 0 : -1; }
          int pthread_join(pthread_t t, void **ret) { WaitForSingleObject(t, INFINITE); if (ret) GetExitCodeThread(t, (LPDWORD)ret); CloseHandle(t); return 0; }
          int pthread_detach(pthread_t t) { CloseHandle(t); return 0; }
          void pthread_exit(void *ret) { ExitThread((DWORD)(uintptr_t)ret); }
          PTSHIM_EOF
          cp include/libvmaf/*.h "$P/include/libvmaf/"
          [ -f build/include/version.h ] && cp build/include/version.h "$P/include/libvmaf/"
          [ -f build/include/libvmaf/version.h ] && cp build/include/libvmaf/version.h "$P/include/libvmaf/"
          P_MIXED="$(cygpath -m "$P" 2>/dev/null || echo "$P")"
          printf '%s\n' \
            "prefix=$P_MIXED" \
            'exec_prefix=${prefix}' \
            'libdir=${prefix}/lib' \
            'includedir=${prefix}/include' \
            '' \
            'Name: libvmaf' \
            'Description: VMAF library' \
            'Version: 3.0.0' \
            'Libs: -L${libdir} -lvmaf -lpthread_shim' \
            'Cflags: -I${includedir} -I${includedir}/libvmaf' \
            > "$P/lib/pkgconfig/libvmaf.pc"
          echo "PKG_CONFIG_PATH=$P_MIXED/lib/pkgconfig;${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

      - name: 安装文档工具（makeinfo / pod2man，--enable-doc 需要）
        shell: bash
        run: |
          # --enable-doc 需要 makeinfo（texinfo 包）与 pod2man（perl 包自带），
          # Windows runner 上两者皆缺；choco/vcpkg 均无 texinfo 包，唯一可靠来源是
          # MSYS2 的 pacman。
          # x64 4 端（windows-2025-vs2026）镜像预装 MSYS2；ARM64 端（windows-11-vs2026-arm）
          # 镜像无 MSYS2（其 toolset 只含 x86_64 mingw64，无 texinfo），需先安装 MSYS2。
          # 注意：MSYS2 官方 ARM64 安装器资产名为 msys2-arm64-*.exe（不是 aarch64），
          # 内容为 x86_64 二进制，经 Windows on ARM 的 x64 仿真运行 —— 官方支持的安装方式。
          if [ ! -x "/c/msys64/usr/bin/pacman.exe" ]; then
            echo "==> MSYS2 未找到，为 ARM64 安装 MSYS2（msys2-arm64-*.exe）..."
            INSTALLER_URL="$(curl -fsSL https://api.github.com/repos/msys2/msys2-installer/releases/latest | \
              python3 -c "import json,sys;d=json.load(sys.stdin);print([a['browser_download_url'] for a in d['assets'] if ('arm64' in a['name'] or 'aarch64' in a['name']) and a['name'].endswith('.exe')][0])")"
            echo "   安装器: ${INSTALLER_URL}"
            curl -fsSL -o /tmp/msys2-arm64.exe "${INSTALLER_URL}"
            /tmp/msys2-arm64.exe in --confirm-command --accept-messages --root C:/msys64
          fi
          # makeinfo/texi2any 来自 texinfo 包；pod2man 是 perl 包自带工具，两者都要装。
          # 注意：MSYS2 的 perl 包把 pod2man 等核心工具装在 /usr/bin/core_perl/ 子目录
          #（MSYS2 的 /etc/profile.d/perlbin.sh 负责把该目录加入 PATH，但只在 MSYS2
          # 登录 shell 生效；Git Bash 不加载它，所以这里必须显式指向 core_perl 路径）。
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed texinfo perl
          # 不要把整个 MSYS2 usr/bin 塞进全局 PATH！其 link.exe（coreutils）会遮蔽
          # MSVC 的 link.exe 导致链接失败，make 也会顶掉 choco make 改变子 shell 行为。
          # 只把文档工具做成包装脚本放进独立目录，仅 prepend 该目录。
          DOCBIN="/c/doctools/bin"
          mkdir -p "$DOCBIN"
          MSYS_PERL="/c/msys64/usr/bin/perl.exe"
          printf '#!/bin/sh\nexec %s /c/msys64/usr/bin/makeinfo "$@"\n' "$MSYS_PERL" > "$DOCBIN/makeinfo"
          printf '#!/bin/sh\nexec %s /c/msys64/usr/bin/texi2any "$@"\n' "$MSYS_PERL" > "$DOCBIN/texi2any"
          printf '#!/bin/sh\nexec %s /c/msys64/usr/bin/core_perl/pod2man "$@"\n' "$MSYS_PERL" > "$DOCBIN/pod2man"
          chmod +x "$DOCBIN"/*
          # 仅 prepend 包装目录（无 link.exe / make 冲突）；makeinfo 由 MSYS2 perl
          # 直接解释，其 @INC 内置 MSYS2 模块路径，无需 MSYS2 bin 进 PATH
          echo 'C:\doctools\bin' >> "${GITHUB_PATH}"
          export PATH="$DOCBIN:${PATH}"
          # 验证
          # 注意：pod2man（podlators）官方只支持 -h/--help，没有 --version 选项，
          # 用 --version 会报 "Unknown option: version" 并在 set -e -o pipefail 下失败。
          command -v makeinfo >/dev/null || { echo "错误：makeinfo 不可用"; exit 1; }
          makeinfo --version 2>&1 | head -n1
          command -v pod2man >/dev/null || { echo "错误：pod2man 不可用"; exit 1; }
          pod2man --help 2>&1 | head -n1
          command -v perl >/dev/null || { echo "错误：perl 不可用"; exit 1; }
          perl -v 2>&1 | sed -n '2p'

      - name: 导出 VMAF meson 日志
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/vmaf/libvmaf/build/meson-logs/meson-log.txt ]; then
            echo "=== /tmp/vmaf/libvmaf/build/meson-logs/meson-log.txt ==="
            cat /tmp/vmaf/libvmaf/build/meson-logs/meson-log.txt
          fi
      - name: 导出 VMAF ninja 日志
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/ninja-vmaf.log ]; then
            echo "=== /tmp/ninja-vmaf.log ==="
            cat /tmp/ninja-vmaf.log
          fi

      - name: 编译 FFmpeg
        shell: bash
        run: |
          __clean_path() { local __new="" __e; IFS=':' read -ra __entries <<< "$PATH"; for __e in "${__entries[@]}"; do case "$__e" in *[Ss]trawberry*) ;; *) __new="${__new:+${__new}:}${__e}" ;; esac; done; export PATH="$__new"; }
          __clean_path
          set -e; P="${HOME}/ffmpeg-install"
          P_MIXED="$(cygpath -m "$P" 2>/dev/null || echo "$P")"
          # VMAF 假头不得进入 FFmpeg（unistd mkdir / getopt 桩会搞挂 libavformat）
          rm -f "$P/include/unistd.h" "$P_MIXED/include/unistd.h" \
                "$P/include/getopt.h" "$P_MIXED/include/getopt.h" 2>/dev/null || true
          # 从 PKG_CONFIG_DIR 找 pkg-config（不用全局 PKG_CONFIG，避免 Meson 误解析）
          PKG_CONFIG="${PKG_CONFIG_DIR:-$(dirname "$(which pkg-config 2>/dev/null)" 2>/dev/null)}/pkg-config.exe"
          [ ! -f "$PKG_CONFIG" ] && PKG_CONFIG="${PKG_CONFIG_DIR:-$(dirname "$(which pkgconf 2>/dev/null)" 2>/dev/null)}/pkgconf.exe"
          [ ! -f "$PKG_CONFIG" ] && { echo "::error::PKG_CONFIG 未找到"; exit 1; }
          if command -v cygpath >/dev/null 2>&1; then
            PKG_CONFIG="$(cygpath -u "$PKG_CONFIG")"
          fi
          export PKG_CONFIG
          export PKG_CONFIG_PATH="$P_MIXED/lib/pkgconfig;${VCPKG_INSTALLED}/lib/pkgconfig;${PKG_CONFIG_PATH:-}"
          cd /tmp && rm -rf ffmpeg-src
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          python3 "${GITHUB_WORKSPACE}/scripts/ci/patch-ffmpeg-msvc.py" /tmp/ffmpeg-src
          cd ffmpeg-src
          sed -i 's/require libsnappy snappy-c.h snappy_compress -lsnappy -lstdc++/require libsnappy snappy-c.h snappy_compress -lsnappy/' configure
          sed -i 's/require libtwolame twolame.h twolame_init -ltwolame/require libtwolame twolame.h twolame_init -ltwolame -DLIBTWOLAME_STATIC/' configure
          sed -i 's/check_lib libtwolame twolame.h twolame_encode_buffer_float32_interleaved -ltwolame/check_lib libtwolame twolame.h twolame_encode_buffer_float32_interleaved -ltwolame -DLIBTWOLAME_STATIC/' configure
          # Use digit-free lame.lib alias + mpglib (mslink appends digits to check function)
          sed -i '/libmp3lame/s/ -lmp3lame/ lame.lib mpglib.lib/' configure
          # MSVC has no libm; math functions are in ucrt.lib (linked by default)
          # Remove standalone -lm from configure checks (space-delimited, NOT -lmfplat/-lmfuuid etc.)
          sed -i 's/ -lm / /g; s/ -lm$//' configure
          # Compile pthread_shim.lib (VMAF needs non-inline pthread wrappers at link time)
          # Use -nologo (dash) not /nologo: MSYS2 bash translates /prefix to Windows paths
          # Use $P_MIXED (Windows-style C:/...) not $P (MSYS2 /c/...) to avoid double-translation
          if [ -f "$P/lib/pthread_shim.c" ]; then
            cl.exe -nologo -c "-Fo:${P_MIXED}/lib/pthread_shim.obj" "${P_MIXED}/lib/pthread_shim.c" && \
              lib -nologo "-out:${P_MIXED}/lib/pthread_shim.lib" "${P_MIXED}/lib/pthread_shim.obj" && \
              echo "pthread_shim.lib created" || { echo "::error::failed to create pthread_shim.lib"; exit 1; }
          fi
          CUDA_FLAGS=""
          if [ "${{ matrix.cuda }}" = "true" ]; then
            export CUDA_HOME="/c/cuda"
            export CUDA_PATH="/c/cuda"
            export CUDACXX="/c/cuda/bin/nvcc"
            export PATH="/c/cuda/bin:${PATH}"
            CUDA_FLAGS="--enable-cuda-nvcc --enable-cuvid --enable-nvenc"
            CL="${CUDA_HOME_MIXED}/lib/x64"; [ ! -d "/c/cuda/lib/x64" ] && CL="${CUDA_HOME_MIXED}/lib"
          fi
          AMF_FLAGS=""
          if [ "${{ matrix.amf }}" = "true" ]; then
            AMF_DIR="/tmp/AMF"
            [ ! -d "$AMF_DIR" ] && git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git "$AMF_DIR"
            AMF_INCLUDE_DIR="$AMF_DIR/amf/public/include"
            if [ ! -d "$AMF_INCLUDE_DIR/AMF" ]; then
              mkdir -p "$AMF_INCLUDE_DIR/AMF"
              cp -r "$AMF_INCLUDE_DIR/core" "$AMF_INCLUDE_DIR/components" "$AMF_INCLUDE_DIR/AMF/"
            fi
            AMF_INCLUDE="$(cygpath -m "$AMF_INCLUDE_DIR")"
            AMF_FLAGS="--enable-amf"
          fi
          VPL_FLAGS=""
          if [ "${{ matrix.vpl }}" = "true" ]; then
            VPL_FLAGS="--enable-libvpl"
          fi
          # 交叉 ARM64：摘掉 x64 nasm；装 gas-preprocessor（armasm64 编 NEON 汇编需要）
          if [ "${VSCMD_ARG_TGT_ARCH:-}" = "arm64" ] || [ "${VSCMD_ARG_TGT_ARCH:-}" = "arm" ]; then
            __clean_nasm() { local __new="" __e; IFS=':' read -ra __entries <<< "$PATH"; for __e in "${__entries[@]}"; do case "$__e" in *[Nn][Aa][Ss][Mm]*) ;; *[Yy][Aa][Ss][Mm]*) ;; *) __new="${__new:+${__new}:}${__e}" ;; esac; done; export PATH="$__new"; }
            __clean_nasm
            hash -r 2>/dev/null || true
            GAS_BIN="${HOME}/bin"
            mkdir -p "$GAS_BIN"
            curl -fsSL -o "$GAS_BIN/gas-preprocessor.pl" \
              https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/master/gas-preprocessor.pl
            PERL=""
            for c in \
              "/c/Program Files/Git/usr/bin/perl.exe" \
              "/usr/bin/perl" \
              "/c/Strawberry/perl/bin/perl.exe" \
              "$(command -v perl 2>/dev/null || true)"; do
              if [ -n "$c" ] && [ -x "$c" ]; then PERL="$c"; break; fi
            done
            if [ -z "$PERL" ]; then
              echo "::error::perl not found (gas-preprocessor needs perl for armasm64)"
              exit 1
            fi
            # 包装：MSYS 下 shebang 不可靠，用 perl 显式调用
            mv "$GAS_BIN/gas-preprocessor.pl" "$GAS_BIN/gas-preprocessor.pl.bin"
            printf '%s\n' "#!/bin/sh" "exec \"$PERL\" \"$GAS_BIN/gas-preprocessor.pl.bin\" \"\$@\"" \
              > "$GAS_BIN/gas-preprocessor.pl"
            chmod +x "$GAS_BIN/gas-preprocessor.pl" "$GAS_BIN/gas-preprocessor.pl.bin"
            export PATH="$GAS_BIN:${PATH}"
            command -v gas-preprocessor.pl
            command -v armasm64 || command -v armasm64.exe || echo "::warning::armasm64 not in PATH yet"
            gas-preprocessor.pl -arch aarch64 -as-type armasm -- armasm64 -h >/dev/null 2>&1 \
              || gas-preprocessor.pl -arch aarch64 -as-type armasm -- armasm64.exe -h \
              || { echo "::error::gas-preprocessor + armasm64 smoke test failed"; exit 1; }
          fi
          ./configure --toolchain=msvc --prefix="$P" \
            --pkg-config="$PKG_CONFIG" \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$P_MIXED/include -I${VCPKG_INSTALLED}/include ${CUDA_HOME_MIXED:+-I${CUDA_HOME_MIXED}/include} ${AMF_INCLUDE:+-I${AMF_INCLUDE}} -I${VCPKG_INSTALLED}/include/vpl -DLIBTWOLAME_STATIC" \
            --extra-ldflags="-LIBPATH:$P_MIXED/lib ${CL:+-LIBPATH:$CL} -LIBPATH:${VCPKG_INSTALLED}/lib" \
            --extra-libs="advapi32.lib ole32.lib ws2_32.lib user32.lib bcrypt.lib cfgmgr32.lib gdi32.lib shell32.lib libcpmt.lib" \
            --enable-gpl --enable-version3 --enable-nonfree \
            ${{ matrix.configure_extra }} --enable-opencl --enable-vulkan \
            --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-libtheora --enable-libaom --enable-libwebp --enable-libass --enable-libfreetype --enable-fontconfig --enable-libzimg --enable-libsoxr --enable-libopenjpeg --enable-libsnappy --enable-libdav1d --enable-libopenh264 --enable-libtwolame --enable-libspeex --enable-libjxl --enable-libmp3lame --enable-libfdk-aac --enable-sdl2 --enable-d3d11va --enable-d3d12va --enable-dxva2 --enable-mediafoundation --enable-doc
          make -j"$(nproc)" && make install

      - name: 失败时导出 ffbuild/config.log
        if: failure()
        shell: bash
        run: |
          echo "=== ffbuild/config.log ==="
          cat /tmp/ffmpeg-src/ffbuild/config.log 2>/dev/null || echo "(config.log not found)"
          echo "=== pkg-config libmp3lame ==="
          ${PKG_CONFIG:-true} --debug libmp3lame 2>&1 | head -40 || true
          echo "=== pkg-config libfdk-aac ==="
          ${PKG_CONFIG:-true} --debug libfdk-aac 2>&1 | head -40 || true
          echo "=== pkg-config vpl ==="
          ${PKG_CONFIG:-true} --debug vpl 2>&1 | head -40 || true

      - name: 验证
        shell: bash
        run: |
          "${HOME}/ffmpeg-install/bin/ffmpeg.exe" -version 2>&1 | head -n5
          echo "--- HW Accel ---"
          "${HOME}/ffmpeg-install/bin/ffmpeg.exe" -hide_banner -hwaccels 2>&1 || echo "（无）"
          echo "--- Encoders ---"
          "${HOME}/ffmpeg-install/bin/ffmpeg.exe" -hide_banner -encoders 2>&1 | grep -iE 'nvenc|amf|qsv|libmp3lame|libfdk_aac' | head -10 || echo "（无）"
          echo "--- VMAF ---"
          "${HOME}/ffmpeg-install/bin/ffmpeg.exe" -hide_banner -filters 2>&1 | grep -i vmaf || echo "（无）"

      - name: 打包
        shell: pwsh
        run: |
          $b = "$env:USERPROFILE\ffmpeg-install\bin"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "$b\ffmpeg.exe","$b\ffprobe.exe","$b\ffplay.exe" dist\ -ErrorAction SilentlyContinue
          $docDir = "$env:USERPROFILE\ffmpeg-install\share\doc\ffmpeg"
          if (Test-Path $docDir) { Copy-Item $docDir dist\doc -Recurse -Force }
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }} -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  macos-arm:
    name: macOS ARM（VideoToolbox）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          brew install yasm nasm pkg-config meson ninja cmake wget texinfo lame fdk-aac sdl2 x264 x265 libvpx opus libvorbis theora aom webp libass freetype fontconfig zimg libsoxr openjpeg snappy molten-vk shaderc svt-av1 dav1d kvazaar openh264 xvid twolame speex codec2 jpeg-xl libopenmpt libbs2b aribb24 libplacebo rubberband libvidstab

      - name: 编译 VMAF（CPU）
        run: |
          # 用 xcrun 包装，避免绝对路径 clang 缺 -isysroot 导致 meson “cannot compile”
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="clang"
          export CXX="clang++"
          export OBJC="clang"
          export CFLAGS="${CFLAGS:-} -isysroot ${SDKROOT}"
          export CXXFLAGS="${CXXFLAGS:-} -isysroot ${SDKROOT}"
          export LDFLAGS="${LDFLAGS:-} -isysroot ${SDKROOT}"
          echo "Apple Clang: $(clang --version | head -1)"
          echo "SDKROOT=${SDKROOT}"
          P="${HOME}/ffmpeg-install"
          cd /tmp && git clone --depth 1 https://github.com/Netflix/vmaf.git
          cd vmaf/libvmaf && rm -rf build
          PKG_CONFIG_PATH="$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
          CC="$CC" CXX="$CXX" CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS" \
          meson setup build --buildtype release --prefix="$P" -Denable_cuda=false
          ninja -vC build && ninja -C build install
          echo "PKG_CONFIG_PATH=$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

      - name: 编译 FFmpeg
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="clang"
          export CXX="clang++"
          export OBJC="clang"
          export CFLAGS="${CFLAGS:-} -isysroot ${SDKROOT}"
          export CXXFLAGS="${CXXFLAGS:-} -isysroot ${SDKROOT}"
          export LDFLAGS="${LDFLAGS:-} -isysroot ${SDKROOT}"
          echo "Apple Clang: $(clang --version | head -1)"
          echo "SDKROOT=${SDKROOT}"
          P="${HOME}/ffmpeg-install"
          LAME_PREFIX="$(brew --prefix lame)"
          FDK_PREFIX="$(brew --prefix fdk-aac)"
          # Homebrew 的 lame 不带 .pc 文件，手动生成 libmp3lame.pc
          LAME_INCLUDE=$(ls -d "${LAME_PREFIX}/include"/*/ 2>/dev/null | head -1 || echo "${LAME_PREFIX}/include")
          {
            echo "prefix=${LAME_PREFIX}"
            echo 'exec_prefix=${prefix}'
            echo "libdir=${LAME_PREFIX}/lib"
            echo "includedir=${LAME_INCLUDE}"
            echo ""
            echo "Name: libmp3lame"
            echo "Description: LAME MP3 encoder library"
            echo "Version: 3.100"
            echo 'Libs: -L${libdir} -lmp3lame'
            echo 'Cflags: -I${includedir}'
          } > "${P}/lib/pkgconfig/libmp3lame.pc"
          # fdk-aac 有 .pc 但 ffmpeg 需要 libfdk-aac 名
          [ -f "${FDK_PREFIX}/lib/pkgconfig/fdk-aac.pc" ] && ln -sf "${FDK_PREFIX}/lib/pkgconfig/fdk-aac.pc" "${P}/lib/pkgconfig/libfdk-aac.pc"
          BREW_PREFIX="$(brew --prefix)"
          MVK_PREFIX="$(brew --prefix molten-vk 2>/dev/null || true)"
          if [ -d "${MVK_PREFIX}/libexec/include" ]; then
            MVK_CFLAGS="-I${MVK_PREFIX}/libexec/include"
            MVK_LDFLAGS="-L${MVK_PREFIX}/lib -Wl,-rpath,${MVK_PREFIX}/lib"
          else
            MVK_CFLAGS=""
            MVK_LDFLAGS=""
          fi
          # 复制并修复 Homebrew 的 .pc（macOS 没有 libstdc++）
          for pc_dir in "${BREW_PREFIX}/lib/pkgconfig" /opt/homebrew/opt/*/lib/pkgconfig; do
            [ -d "$pc_dir" ] || continue
            for pc in "$pc_dir"/*.pc; do
              [ -f "$pc" ] || continue
              base=$(basename "$pc")
              sed 's/-lstdc++/-lc++/g' "$pc" > "${P}/lib/pkgconfig/$base"
            done
          done
          export PKG_CONFIG_PATH="${P}/lib/pkgconfig:${LAME_PREFIX}/lib/pkgconfig:${FDK_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"
          pkg-config --exists libmp3lame && echo "pkg-config libmp3lame: OK ($(pkg-config --modversion libmp3lame))" || echo "pkg-config libmp3lame: FAIL"
          pkg-config --exists libfdk-aac  && echo "pkg-config libfdk-aac: OK ($(pkg-config --modversion libfdk-aac))"   || echo "pkg-config libfdk-aac: FAIL"
          cd /tmp && git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          cd ffmpeg-src
          # macOS 使用 libc++，configure 里 libsnappy 的 -lstdc++ 会导致检测失败
          sed -i.bak 's/require libsnappy snappy-c.h snappy_compress -lsnappy -lstdc++/require libsnappy snappy-c.h snappy_compress -lsnappy/' configure
          rm -f configure.bak
          ./configure --prefix="$P" \
            --cc="$CC" --cxx="$CXX" \
            --extra-cflags="-isysroot ${SDKROOT} -I$P/include -I${BREW_PREFIX}/include -I${LAME_PREFIX}/include -I${FDK_PREFIX}/include ${MVK_CFLAGS}" \
            --extra-ldflags="-isysroot ${SDKROOT} -L$P/lib -L${BREW_PREFIX}/lib -L${LAME_PREFIX}/lib -L${FDK_PREFIX}/lib ${MVK_LDFLAGS}" \
            --extra-libs="-lpthread -lm" \
            --enable-gpl --enable-version3 --enable-nonfree --enable-lto \
            --enable-libvmaf --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-libtheora --enable-libaom --enable-libwebp --enable-libass --enable-libfreetype --enable-fontconfig --enable-libzimg --enable-libsoxr --enable-libopenjpeg --enable-libsnappy --enable-libmp3lame --enable-libfdk-aac --enable-opencl --enable-vulkan \
            --enable-libsvtav1 --enable-libdav1d --enable-libkvazaar --enable-libopenh264 --enable-libxvid --enable-libtwolame --enable-libspeex --enable-libcodec2 --enable-libjxl --enable-libopenmpt --enable-libbs2b --enable-libaribb24 --enable-libplacebo --enable-librubberband --enable-libvidstab \
            --enable-sdl2 --enable-videotoolbox --enable-audiotoolbox \
            --enable-hwaccel=h264_videotoolbox --enable-hwaccel=hevc_videotoolbox \
            --enable-hwaccel=vp9_videotoolbox --enable-hwaccel=prores_videotoolbox \
            --enable-hwaccel=av1_videotoolbox --enable-doc
          make -j"$(sysctl -n hw.logicalcpu)" && make install

      - name: 失败时导出 ffbuild/config.log
        if: failure()
        run: |
          echo "=== ffbuild/config.log ==="
          cat /tmp/ffmpeg-src/ffbuild/config.log 2>/dev/null || echo "(config.log not found)"
          echo "=== ffbuild/config.log (LAME section) ==="
          grep -A20 'libmp3lame' /tmp/ffmpeg-src/ffbuild/config.log 2>/dev/null || echo "(no libmp3lame section)"

      - name: 裁剪、签名与验证
        run: |
          FF="${HOME}/ffmpeg-install/bin/ffmpeg"
          strip "${FF}" "${FF/%ffmpeg/ffprobe}" "${FF/%ffmpeg/ffplay}" 2>/dev/null || true
          for bin in ffmpeg ffprobe ffplay; do codesign --force --sign - "${HOME}/ffmpeg-install/bin/${bin}" 2>/dev/null || true; done
          "${FF}" -version 2>&1 | head -n5
          echo "--- HW Accel Methods ---"
          "${FF}" -hide_banner -hwaccels 2>&1 || echo "（无）"
          echo "--- VideoToolbox encoders ---"
          "${FF}" -hide_banner -encoders 2>&1 | grep -iE 'h264_videotoolbox|hevc_videotoolbox|prores_videotoolbox' || echo "（无）"
          echo "--- VT hwaccel decode support (via -hwaccel videotoolbox) ---"
          # Modern ffmpeg (6.0+) uses the hwaccel framework for VT decoding, not standalone decoder wrappers.
          # Each --enable-hwaccel=xxx_videotoolbox registers a codec backend under the unified 'videotoolbox' hwaccel.
          # Verify by checking that 'videotoolbox' is listed in -hwaccels AND that each hw-codec is recognized.
          echo "  hwaccel videotoolbox available: $("${FF}" -hide_banner -hwaccels 2>&1 | grep -q videotoolbox && echo YES || echo NO)"
          for c in h264 hevc vp9 prores av1; do
            echo "  hw-codec ${c}: $("${FF}" -hide_banner -hwaccel videotoolbox -codecs 2>&1 | grep -i "${c}" | head -1 || echo '(not listed)')"
          done
          echo "--- VMAF ---"
          "${FF}" -hide_banner -filters 2>&1 | grep -i vmaf || echo "（无）"

      - name: 打包
        run: |
          mkdir -p dist && cp "${HOME}/ffmpeg-install/bin/"{ffmpeg,ffprobe,ffplay} dist/
          [ -d "${HOME}/ffmpeg-install/share/doc/ffmpeg" ] && cp -r "${HOME}/ffmpeg-install/share/doc/ffmpeg" dist/doc || true
          cd dist && tar -cJf ../ffmpeg-macos-arm.tar.xz .

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-macos-arm
          path: ffmpeg-macos-arm.tar.xz
          retention-days: 30

  # ============================================================
  # WINDOWS ARM64 — Snapdragon (Software Encoders + D3D11VA)
  # ============================================================
  release:
    name: 创建 GitHub Release
    needs:
      - metadata
      - linux
      - windows
      - macos-arm
    if: needs.metadata.outputs.should_release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.xz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: FFmpeg ${{ needs.metadata.outputs.release_tag }}
          body: |
            ## 🎬 FFmpeg 多厂商构建

            每个压缩包都包含 **ffmpeg + ffprobe + ffplay**，并带厂商特定的硬件加速。

            ### 📦 Linux（x86_64）

            | 产物 | GPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-linux-nvidia.tar.xz` | NVIDIA | NVENC/CUDA | ✅ CUDA |
            | `ffmpeg-linux-intel-qsv.tar.xz` | Intel | QSV (oneVPL) + VAAPI | ✅ CPU |
            | `ffmpeg-linux-amd.tar.xz` | AMD | VAAPI | ✅ CPU |
            | `ffmpeg-linux-x86-all.tar.xz` | NVIDIA + Intel + AMD | NVENC/CUDA + QSV + VAAPI | ✅ CUDA |

            ### 📦 Linux（ARM64）

            | 产物 | GPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-linux-arm.tar.xz` | — | VAAPI / CPU | ✅ CPU |

            ### 📦 Windows（x86_64，MSVC）

            | 产物 | GPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-windows-nvidia.zip` | NVIDIA | NVENC/CUDA | ✅ CUDA |
            | `ffmpeg-windows-amd-amf.zip` | AMD | AMF | ✅ CPU |
            | `ffmpeg-windows-intel-qsv.zip` | Intel | QSV (oneVPL) | ✅ CPU |
            | `ffmpeg-windows-x86-all.zip` | NVIDIA + Intel + AMD | NVENC/CUDA + QSV + AMF | ✅ CUDA |

            ### 📦 Windows（ARM64，MSVC）

            | 产物 | CPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-windows-arm64.zip` | Snapdragon X | D3D11VA / DXVA2 / MF | ✅ CPU |

            ### 📦 macOS（ARM64）

            | 产物 | GPU | 硬件加速 | VMAF |
            |---|---|---|---|
            | `ffmpeg-macos-arm.tar.xz` | Apple | VideoToolbox | ✅ CPU |

            > 所有构建均包含： libmp3lame + libfdk-aac + SDL2 (ffplay) + libx264 + libx265 + libvpx + libopus + libvorbis + libtheora + libaom + libwebp + libass + libfreetype + fontconfig + libzimg + libsoxr + libopenjpeg + libsnappy
            > Windows 构建使用 MSVC 2026 编译，需要 VC++ 可再发行组件。
          files: release-assets/*
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
